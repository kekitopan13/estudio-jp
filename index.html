<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Apps de Japonés</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: #f5f5f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px 20px;
            color: #1d1d1f;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0 0 6px;
            color: #5b21b6;
            text-align: center;
        }

        .subtitle {
            margin: 0 0 22px;
            font-size: 0.9rem;
            color: #666;
            text-align: center;
        }

        .menu-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .app-card {
            background: white;
            padding: 18px 20px;
            border-radius: 15px;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid rgba(91, 33, 182, 0.08);
        }

        .app-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.08);
        }

        .app-card:active {
            transform: scale(0.98);
            background: #f0f0f0;
        }

        .icon {
            font-size: 2rem;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .details b {
            display: block;
            font-size: 1.08rem;
            margin-bottom: 4px;
        }

        .details span {
            display: block;
            font-size: 0.85rem;
            color: #666;
            line-height: 1.35;
        }
    </style>
</head>
<body>

    <h1>学習メニュー</h1>
    <p class="subtitle">Ejercicios de japonés</p>

    <div class="menu-container">
        <a href="https://kekitopan13.github.io/estudio-jp/falsi_quizlet.html" class="app-card">
            <div class="icon">🃏</div>
            <div class="details">
                <b>Falsi Quizlet</b>
                <span>Repasar vocabulario con tarjetas y alternativas.</span>
            </div>
        </a>

        <a href="https://kekitopan13.github.io/estudio-jp/matchup_inline.html" class="app-card">
            <div class="icon">🧩</div>
            <div class="details">
                <b>Matching exercise</b>
                <span>Unir palabras, lecturas o significados correspondientes.</span>
            </div>
        </a>

        <a href="https://kekitopan13.github.io/estudio-jp/kanji_study_complejo.html" class="app-card">
            <div class="icon">漢</div>
            <div class="details">
                <b>Kanji Study</b>
                <span>Practicar kanji por etapas: memoria, lectura y comprensión.</span>
            </div>
        </a>
    </div>

</body>
</html>
