<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #f0faf6; }
  body {

    background: #f7fdfb;
    position: relative;
  }
  .kanji-font { font-family: 'Noto Serif JP', serif; }
  .jp-font { font-family: 'Noto Sans JP', sans-serif; }
  button { -webkit-appearance: none; appearance: none; transition: transform 0.1s, background 0.2s, border-color 0.2s, color 0.2s; }

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ─── HELPERS ────────────────────────────────────────────────────────────────
function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

const SMALL_KANA = new Set(['ゃ','ゅ','ょ','ぁ','ぃ','ぅ','ぇ','ぉ','ャ','ュ','ョ','ァ','ィ','ゥ','ェ','ォ']);

// Divide una palabra en moras. しゃしゅしょ etc. quedan como una sola pieza,
// っ / ん / ー / vocales largas quedan siempre como piezas independientes.
function splitMoras(str) {
  const chars = [...str];
  const moras = [];
  for (let i = 0; i < chars.length; i++) {
    const ch = chars[i];
    if (SMALL_KANA.has(ch)) { moras.push(ch); continue; } // huérfano, caso raro
    if (i + 1 < chars.length && SMALL_KANA.has(chars[i + 1])) {
      moras.push(ch + chars[i + 1]);
      i++;
    } else {
      moras.push(ch);
    }
  }
  return moras;
}

// ─── COLORES (idénticos a aprendizaje.html) ─────────────────────────────────
const C = {
  bg:          "#f7fdfb",
  bgAlt:       "#edf7f3",
  bgCard:      "#ffffff",
  bgDeep:      "#e4f5ef",
  text:        "#1a2e28",
  textMuted:   "#5a7a72",
  textDim:     "#9bbdb5",
  mint:        "#B3EEE3",
  mintDark:    "#7dd4c4",
  mintDeep:    "#4fbfac",
  pink:        "#FA7DB3",
  pinkLight:   "rgba(250,125,179,0.15)",
  pinkDark:    "#e8609a",
  correct:     "#4fbfac",
  correctBg:   "rgba(79,191,172,0.12)",
  wrong:       "#FA7DB3",
  wrongBg:     "rgba(250,125,179,0.15)",
  border:      "#c8e8e0",
  borderLight: "#dff2ed",
  white:       "#ffffff",
  shadow:      "0 2px 12px rgba(79,191,172,0.12)",
  shadowCard:  "0 1px 4px rgba(0,0,0,0.06)",
  yellow:      "#fffbe6",
  yellowBorder:"#f0d060",
  yellowText:  "#8a7020",
  challenge:   "#fff3e0",
  challengeBorder: "#ffb74d",
  challengeText: "#e65100",
  challengeDeep: "#f57c00",
};

// ─── PARSEO DE ENTRADA ───────────────────────────────────────────────────────
// Formato: furigana;significado (una pareja por línea)
function parseInput(text) {
  const lines = (text || "").split("\n").map(l => l.trim()).filter(Boolean);
  const words = [];
  const errors = [];
  lines.forEach((line, idx) => {
    const parts = line.split(";");
    if (parts.length < 2) { errors.push(idx + 1); return; }
    const furigana = parts[0].trim();
    const es = parts.slice(1).join(";").replace(/"/g, "").trim();
    if (!furigana || !es) { errors.push(idx + 1); return; }
    words.push({ furigana, es, moras: splitMoras(furigana) });
  });
  return { words, errors };
}

// ─── PERSISTENCIA ────────────────────────────────────────────────────────────
const CONFIG_KEY = "word_forge_config";
const SESSION_KEY = "word_forge_session";

function saveConfig(cfg) { try { localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg)); } catch(e) {} }
function loadConfig() { try { const raw = localStorage.getItem(CONFIG_KEY); return raw ? JSON.parse(raw) : null; } catch(e) { return null; } }
function saveSession(state) { try { localStorage.setItem(SESSION_KEY, JSON.stringify(state)); } catch(e) {} }
function loadSession() { try { const raw = localStorage.getItem(SESSION_KEY); return raw ? JSON.parse(raw) : null; } catch(e) { return null; } }
function clearSession() { try { localStorage.removeItem(SESSION_KEY); } catch(e) {} }
function clearAll() { try { localStorage.removeItem(SESSION_KEY); localStorage.removeItem(CONFIG_KEY); } catch(e) {} }

// ─── COMPONENTES COMPARTIDOS ─────────────────────────────────────────────────
function PrimaryBtn({ onClick, children, disabled }) {
  return (
    <button onClick={onClick} disabled={disabled} style={{
      width: "100%", padding: "17px",
      background: disabled ? C.bgDeep : `linear-gradient(135deg, ${C.mintDeep}, ${C.mintDark})`,
      border: "none", borderRadius: 14,
      color: disabled ? C.textDim : C.white,
      fontSize: 17, fontWeight: 600,
      cursor: disabled ? "not-allowed" : "pointer",
      fontFamily: "'DM Sans', sans-serif",
      boxShadow: disabled ? "none" : C.shadow,
      transition: "transform 0.1s",
    }}
    onPointerDown={e => { if (!disabled) e.currentTarget.style.transform = "scale(0.97)"; }}
    onPointerUp={e => e.currentTarget.style.transform = "scale(1)"}
    onPointerLeave={e => e.currentTarget.style.transform = "scale(1)"}
    >{children}</button>
  );
}

function TopBar({ title = "🔨 Word Forge", onExit }) {
  return (
    <div style={{
      padding: "12px 16px",
      display: "flex", alignItems: "center", justifyContent: "space-between",
      background: C.white, borderBottom: `1px solid ${C.borderLight}`,
    }}>
      <span style={{ fontSize: 15, fontWeight: 600, color: C.text }}>{title}</span>
      {onExit && (
        <button onClick={onExit} style={{
          padding: "6px 12px", borderRadius: 8,
          background: C.bgDeep, border: `1px solid ${C.border}`,
          color: C.textMuted, fontSize: 12, cursor: "pointer",
          fontFamily: "'DM Sans', sans-serif",
        }}>Salir</button>
      )}
    </div>
  );
}

function ProgressBar({ current, total, color }) {
  const pct = total > 0 ? Math.round((current / total) * 100) : 0;
  return (
    <div style={{ height: 5, background: C.bgDeep, borderRadius: 3, overflow: "hidden" }}>
      <div style={{
        height: "100%", width: `${pct}%`,
        background: color || `linear-gradient(90deg, ${C.mintDeep}, ${C.pink})`,
        borderRadius: 3, transition: "width 0.4s ease",
      }} />
    </div>
  );
}

function CopyGate({ target, onDone }) {
  const [input, setInput] = useState("");
  const [shake, setShake] = useState(false);
  const [correct, setCorrect] = useState(false);
  function submit() {
    if (correct) return;
    if (input.trim() === target) { setCorrect(true); setTimeout(onDone, 600); }
    else { setShake(true); setTimeout(() => setShake(false), 400); }
  }
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14, padding: "14px 0" }}>
      <div style={{ textAlign: "center", fontSize: 12, color: C.textMuted, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.08em" }}>
        Copia la palabra para continuar
      </div>
      <div className="jp-font" style={{
        textAlign: "center", fontSize: 26, color: C.text, letterSpacing: "0.15em",
        background: C.bgCard, borderRadius: 14, padding: "14px",
        border: `1px solid ${C.borderLight}`, boxShadow: C.shadowCard,
      }}>{target}</div>
      {correct && <div style={{ textAlign: "center", color: C.mintDeep, fontWeight: 700 }}>✓ Correct</div>}
      <input
        value={input}
        onChange={e => setInput(e.target.value)}
        onKeyDown={e => { if (e.key === "Enter") submit(); }}
        placeholder="Escribe aquí..."
        className="jp-font"
        style={{
          padding: "16px 18px", borderRadius: 13, fontSize: 20,
          background: C.bgCard, border: `1.5px solid ${shake ? C.pink : C.border}`,
          color: C.text, outline: "none", textAlign: "center", letterSpacing: "0.15em",
          fontFamily: "'Noto Sans JP', sans-serif",
        }}
      />
      <PrimaryBtn onClick={submit} disabled={!input || correct}>{correct ? "✓" : "Verificar"}</PrimaryBtn>
    </div>
  );
}

function MeaningCard({ text }) {
  return (
    <div style={{
      background: C.bgCard, borderRadius: 14, padding: "18px 20px",
      border: `1px solid ${C.borderLight}`, boxShadow: C.shadowCard, textAlign: "center",
    }}>
      <div style={{ fontSize: 10, color: C.textDim, marginBottom: 4, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.1em" }}>Significado</div>
      <div style={{ fontSize: 17, color: C.text, lineHeight: 1.5 }}>{text}</div>
    </div>
  );
}

// ─── FASE 1: EXPOSICIÓN ──────────────────────────────────────────────────────
function ExposicionEx({ word, onNext }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", padding: "20px 24px 28px", gap: 18, flex: 1, justifyContent: "center" }}>
      <div style={{ textAlign: "center" }}>
        <div className="jp-font" style={{ fontSize: 44, color: C.text, letterSpacing: "0.12em" }}>{word.furigana}</div>
      </div>
      <MeaningCard text={word.es} />
      <PrimaryBtn onClick={onNext}>OK</PrimaryBtn>
    </div>
  );
}

// ─── FASE 2: RECONOCIMIENTO ──────────────────────────────────────────────────
function ReconocimientoEx({ word, blockWords, globalWords, onNext }) {
  const [options] = useState(() => {
    const others = blockWords.filter(w => w.furigana !== word.furigana);
    let distractor;
    if (others.length) distractor = shuffle(others)[0];
    else {
      const globalOthers = (globalWords || []).filter(w => w.furigana !== word.furigana);
      distractor = globalOthers.length ? shuffle(globalOthers)[0] : word;
    }
    return shuffle([word, distractor]);
  });
  const [chosen, setChosen] = useState(null);
  const [wrong, setWrong] = useState(false);

  function pick(opt) {
    if (chosen) return;
    setChosen(opt);
    const success = opt.furigana === word.furigana;
    if (!success) setWrong(true);
    setTimeout(() => onNext(success), success ? 600 : 1100);
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", padding: "20px 20px 28px", gap: 24, flex: 1, justifyContent: "center" }}>
      <MeaningCard text={word.es} />
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {options.map((opt, i) => {
          const isCorrectShown = (wrong || chosen === opt) && opt.furigana === word.furigana;
          const isChosenWrong = chosen === opt && wrong;
          return (
            <button key={i} onClick={() => pick(opt)} className="jp-font" style={{
              padding: "18px 20px", borderRadius: 13, fontSize: 22,
              background: isCorrectShown ? C.correctBg : isChosenWrong ? C.wrongBg : C.bgCard,
              border: `1.5px solid ${isCorrectShown ? C.mintDeep : isChosenWrong ? C.pink : C.border}`,
              color: isCorrectShown ? C.mintDeep : isChosenWrong ? C.pinkDark : C.text,
              cursor: chosen ? "default" : "pointer", letterSpacing: "0.15em", textAlign: "center",
              fontFamily: "'Noto Sans JP', sans-serif", boxShadow: C.shadowCard,
            }}>{opt.furigana}</button>
          );
        })}
      </div>
      {chosen && !wrong && <div style={{ textAlign: "center", color: C.mintDeep, fontWeight: 700 }}>✓ Correct</div>}
    </div>
  );
}

// ─── FASE 3: CONSTRUCCIÓN ────────────────────────────────────────────────────
function ConstruccionEx({ word, onNext }) {
  const moras = word.moras;
  const [slots, setSlots] = useState(moras.map(() => null));
  const [pool, setPool] = useState(() => shuffle(moras.map((m, i) => ({ m, used: false, key: i }))));
  const [fails, setFails] = useState(0);
  const [wrongPick, setWrongPick] = useState(null);
  const [done, setDone] = useState(false);

  function handlePick(idx) {
    if (done) return;
    const item = pool[idx];
    if (!item || item.used) return;
    const nextEmpty = slots.findIndex(s => s === null);
    if (nextEmpty === -1) return;
    if (item.m === moras[nextEmpty]) {
      const ns = [...slots]; ns[nextEmpty] = item.m; setSlots(ns);
      setPool(p => p.map((it, i) => i === idx ? { ...it, used: true } : it));
      if (ns.every(s => s !== null)) {
        setDone(true);
        setTimeout(() => onNext(fails), 600);
      }
    } else {
      setFails(fails + 1);
      setWrongPick(idx);
      setTimeout(() => setWrongPick(null), 400);
    }
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", padding: "16px 20px 24px", gap: 16, flex: 1, justifyContent: "center" }}>
      <div style={{ textAlign: "center" }}>
        <div style={{ fontSize: 14, color: C.textMuted, marginBottom: 14 }}>{word.es}</div>
        <div style={{ display: "flex", justifyContent: "center", gap: 6, flexWrap: "wrap" }}>
          {moras.map((m, i) => (
            <div key={i} className="jp-font" style={{
              minWidth: 46, height: 46, padding: "0 4px",
              border: `2px dashed ${slots[i] ? C.mintDeep : C.border}`,
              borderRadius: 11, display: "flex", alignItems: "center", justifyContent: "center",
              fontSize: 20, color: slots[i] ? C.mintDeep : "transparent",
              background: slots[i] ? C.correctBg : "transparent", transition: "all 0.2s",
            }}>{slots[i] || m}</div>
          ))}
        </div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 8 }}>
        {pool.map((it, i) => it.used ? <div key={i} style={{ height: 56 }} /> : (
          <button key={i} onClick={() => handlePick(i)} className="jp-font" style={{
            height: 56, fontSize: 20,
            background: wrongPick === i ? C.wrongBg : C.bgCard, border: `1.5px solid ${wrongPick === i ? C.pink : C.border}`,
            borderRadius: 12, color: wrongPick === i ? C.pinkDark : C.text, cursor: "pointer",
            fontFamily: "'Noto Sans JP', sans-serif", boxShadow: C.shadowCard,
          }}>{it.m}</button>
        ))}
      </div>
      {done && <div style={{ textAlign: "center", color: C.mintDeep, fontWeight: 700 }}>✓ Correct<br /><span className="jp-font" style={{ fontSize: 20, letterSpacing: "0.12em" }}>{word.furigana}</span></div>}
    </div>
  );
}

// ─── FASE 4: ESCRITURA ───────────────────────────────────────────────────────
function EscrituraEx({ word, onNext }) {
  const [input, setInput] = useState("");
  const [fails, setFails] = useState(0);
  const [copyMode, setCopyMode] = useState(false);
  const [shake, setShake] = useState(false);
  const [correct, setCorrect] = useState(false);
  const inputRef = useRef(null);

  useEffect(() => { setTimeout(() => inputRef.current?.focus(), 100); }, []);

  function submit() {
    if (copyMode || correct) return;
    const trimmed = input.trim();
    if (trimmed === word.furigana) { setCorrect(true); setTimeout(() => onNext(fails), 600); return; }
    const nf = fails + 1; setFails(nf);
    setShake(true); setTimeout(() => setShake(false), 400);
    if (nf === 1) { setInput(""); }
    else { setCopyMode(true); }
  }

  function noRecuerdo() { setFails(2); setCopyMode(true); }

  if (copyMode) {
    return (
      <div style={{ padding: "20px 20px 28px", flex: 1, display: "flex", flexDirection: "column", justifyContent: "center" }}>
        <div style={{ textAlign: "center", fontSize: 14, color: C.textMuted, marginBottom: 10 }}>{word.es}</div>
        <CopyGate target={word.furigana} onDone={() => onNext(2)} />
      </div>
    );
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", padding: "20px 20px 28px", gap: 20, flex: 1, justifyContent: "center" }}>
      <MeaningCard text={word.es} />
      <input
        ref={inputRef}
        value={input}
        onChange={e => setInput(e.target.value)}
        onKeyDown={e => { if (e.key === "Enter") submit(); }}
        placeholder="Escribe la palabra..."
        className="jp-font"
        disabled={correct}
        style={{
          padding: "16px 18px", borderRadius: 13, fontSize: 20,
          background: correct ? C.correctBg : C.bgCard, border: `1.5px solid ${correct ? C.mintDeep : shake ? C.pink : C.border}`,
          color: C.text, outline: "none", textAlign: "center", letterSpacing: "0.15em",
          fontFamily: "'Noto Sans JP', sans-serif",
        }}
      />
      {correct && <div style={{ textAlign: "center", color: C.mintDeep, fontWeight: 700 }}>✓ Correct<br /><span className="jp-font" style={{ fontSize: 20, letterSpacing: "0.12em" }}>{word.furigana}</span></div>}
      <PrimaryBtn onClick={submit} disabled={!input || correct}>{correct ? "✓" : "Verificar"}</PrimaryBtn>
      <button onClick={noRecuerdo} style={{
        background: "none", border: "none", color: C.textMuted, fontSize: 12,
        cursor: "pointer", textDecoration: "underline", fontFamily: "'DM Sans', sans-serif",
      }}>No me acuerdo</button>
    </div>
  );
}

// ─── RONDA RECALL: generación de preguntas ─────────────────────────────────
function buildDistractors(w, key, blockWords, seenPool, count) {
  const primary = shuffle(blockWords.filter(x => x.furigana !== w.furigana && x[key] !== w[key]));
  let result = primary.slice(0, count);
  if (result.length < count) {
    const extra = shuffle(seenPool.filter(x =>
      x.furigana !== w.furigana && x[key] !== w[key] && !result.some(r => r[key] === x[key])
    ));
    result = result.concat(extra.slice(0, count - result.length));
  }
  return result.slice(0, count).map(x => x[key]);
}

function buildFinalChoiceQueue(failedWords, allWords) {
  const jpToEs = shuffle(failedWords).map(w => ({
    type: 'word2sig', word: w,
    options: shuffle([w.es, ...buildDistractors(w, 'es', allWords, allWords, 3)]),
  }));
  const esToJp = shuffle(failedWords).map(w => ({
    type: 'sig2wordChoice', word: w,
    options: shuffle([w.furigana, ...buildDistractors(w, 'furigana', allWords, allWords, 3)]),
  }));
  return [...jpToEs, ...esToJp];
}

function sortJapanese(words) {
  return [...words].sort((a, b) => a.furigana.localeCompare(b.furigana, 'ja'));
}

// ─── COMPONENTES DEL TEST FINAL ────────────────────────────────────────────
function TestMC({ label, labelJp, options, optionsJp, correct, onNext }) {
  const [chosen, setChosen] = useState(null);
  const [wrong, setWrong] = useState(false);

  function pick(opt) {
    if (chosen) return;
    setChosen(opt);
    const success = opt === correct;
    if (!success) setWrong(true);
    setTimeout(() => onNext(success), success ? 600 : 1000);
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", padding: "20px 20px 28px", gap: 20, flex: 1, justifyContent: "center" }}>
      <div style={{ background: C.challenge, borderRadius: 14, padding: "18px 20px", border: `1px solid ${C.challengeBorder}`, textAlign: "center" }}>
        <div className={labelJp ? "jp-font" : undefined} style={{ fontSize: labelJp ? 26 : 17, color: C.text, letterSpacing: labelJp ? "0.12em" : "normal" }}>{label}</div>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {options.map((opt, i) => {
          const isCorrectShown = (wrong || chosen === opt) && opt === correct;
          const isChosenWrong = chosen === opt && wrong;
          return (
            <button key={i} onClick={() => pick(opt)} className={optionsJp ? "jp-font" : undefined} style={{
              padding: "15px 18px", borderRadius: 13, fontSize: optionsJp ? 19 : 15,
              background: isCorrectShown ? C.correctBg : isChosenWrong ? C.wrongBg : C.bgCard,
              border: `1.5px solid ${isCorrectShown ? C.mintDeep : isChosenWrong ? C.pink : C.challengeBorder}`,
              color: isCorrectShown ? C.mintDeep : isChosenWrong ? C.pinkDark : C.text,
              cursor: chosen ? "default" : "pointer",
              textAlign: optionsJp ? "center" : "left", lineHeight: 1.4,
              letterSpacing: optionsJp ? "0.12em" : "normal",
              fontFamily: optionsJp ? "'Noto Sans JP', sans-serif" : "'DM Sans', sans-serif",
              boxShadow: C.shadowCard,
            }}>{opt}</button>
          );
        })}
      </div>
      {chosen && !wrong && <div style={{ textAlign: "center", color: C.mintDeep, fontWeight: 700 }}>✓ Correct</div>}
    </div>
  );
}

function TestWrite({ word, onNext }) {
  const [input, setInput] = useState("");
  const [status, setStatus] = useState("idle"); // idle | correct | wrong
  const inputRef = useRef(null);

  useEffect(() => { setTimeout(() => inputRef.current?.focus(), 100); }, []);

  function submit() {
    if (status === "correct" || status === "wrong") return;
    if (input.trim() === word.furigana) {
      setStatus("correct");
      setTimeout(() => onNext(true), 600);
    } else {
      setStatus("wrong");
    }
  }

  const borderColor = status === "correct" ? C.mintDeep : status === "wrong" ? C.pink : C.challengeBorder;
  const bg = status === "correct" ? C.correctBg : status === "wrong" ? C.wrongBg : C.bgCard;

  return (
    <div style={{ display: "flex", flexDirection: "column", padding: "20px 20px 28px", gap: 20, flex: 1, justifyContent: "center" }}>
      <div style={{ background: C.challenge, borderRadius: 14, padding: "18px 20px", border: `1px solid ${C.challengeBorder}`, textAlign: "center" }}>
        <div style={{ fontSize: 17, color: C.text }}>{word.es}</div>
      </div>
      {status === "correct" && <div style={{ textAlign: "center", color: C.mintDeep, fontWeight: 700 }}>✓ Correct<br /><span className="jp-font" style={{ fontSize: 20, letterSpacing: "0.12em" }}>{word.furigana}</span></div>}
      {status === "wrong" ? <>
        <div style={{ textAlign: "center", color: C.pinkDark, fontWeight: 700 }}>✗ No fue correcta</div>
        <PrimaryBtn onClick={() => onNext(false)}>Continuar</PrimaryBtn>
      </> : <>
        <input
          ref={inputRef}
          value={input}
          onChange={e => { setInput(e.target.value); if (status === "wrong") setStatus("idle"); }}
          onKeyDown={e => { if (e.key === "Enter") submit(); }}
          disabled={status === "correct"}
          placeholder="Escribe la palabra..."
          className="jp-font"
          style={{
            padding: "16px 18px", borderRadius: 13, fontSize: 20,
            background: bg, border: `1.5px solid ${borderColor}`, color: C.text,
            outline: "none", textAlign: "center", letterSpacing: "0.15em",
            fontFamily: "'Noto Sans JP', sans-serif",
          }}
        />
        <PrimaryBtn onClick={submit} disabled={!input || status === "correct"}>{status === "correct" ? "✓" : "Verificar"}</PrimaryBtn>
      </>}
    </div>
  );
}

function TestChoiceEx({ question, onNext }) {
  if (question.type === 'word2sig') return <TestMC label={question.word.furigana} labelJp options={question.options} correct={question.word.es} onNext={onNext} />;
  if (question.type === 'sig2wordChoice') return <TestMC label={question.word.es} options={question.options} optionsJp correct={question.word.furigana} onNext={onNext} />;
  return null;
}

}

// ─── RESULTADOS DEL TEST FINAL ──────────────────────────────────────────────
function ResultScreen({ words, wordStats, testResults, onNewSession, onExit }) {
  const sortedWords = sortJapanese(words);
  const counts = { mastered: 0, recognized: 0, pending: 0, difficult: 0 };
  const rows = sortedWords.map(w => {
    const test = testResults[w.furigana] || {};
    const status = test.writing ? 'mastered' : (test.jpToEs && test.esToJp ? 'recognized' : 'pending');
    const hadDifficulty = !!wordStats[w.furigana] && (wordStats[w.furigana].errors > 0 || wordStats[w.furigana].copied);
    counts[status]++;
    if (hadDifficulty) counts.difficult++;
    return { w, status, hadDifficulty };
  });
  const labels = {
    mastered: { title: 'Dominada', color: C.mintDeep, icon: '✓' },
    recognized: { title: 'Reconocida', color: C.yellowText, icon: '•' },
    pending: { title: 'Pendiente', color: C.pinkDark, icon: '✗' },
  };

  return (
    <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>
      <TopBar onExit={onExit} />
      <div style={{ flex: 1, overflowY: "auto", padding: "24px 20px 32px", display: "flex", flexDirection: "column", gap: 20 }}>
        <div style={{ textAlign: "center" }}>
          <div style={{ fontSize: 40, marginBottom: 6 }}>🔨</div>
          <div style={{ fontSize: 19, fontWeight: 700, color: C.text }}>Resultado final</div>
          <div style={{ fontSize: 12, color: C.textMuted, marginTop: 3 }}>Palabras ordenadas por lectura japonesa</div>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
          <StatCard label="Dominadas" value={counts.mastered} color={C.mintDeep} />
          <StatCard label="Reconocidas" value={counts.recognized} color={C.yellowText} />
          <StatCard label="Pendientes" value={counts.pending} color={C.pinkDark} />
          <StatCard label="Costaron al aprender" value={counts.difficult} color={C.textMuted} />
        </div>
        <div style={{ background: C.bgCard, borderRadius: 14, overflow: "hidden", border: `1px solid ${C.borderLight}`, boxShadow: C.shadowCard }}>
          {rows.map(({ w, status, hadDifficulty }, i) => {
            const meta = labels[status];
            return <div key={w.furigana} style={{ padding: "11px 16px", borderBottom: i < rows.length - 1 ? `1px solid ${C.borderLight}` : "none" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <span style={{ fontSize: 15, color: meta.color }}>{meta.icon}</span>
                <span className="jp-font" style={{ fontSize: 15, color: C.text, minWidth: 90 }}>{w.furigana}</span>
                <span style={{ fontSize: 12, color: C.textDim, flex: 1 }}>{w.es}</span>
              </div>
              <div style={{ marginLeft: 25, marginTop: 3, fontSize: 10, color: meta.color, fontWeight: 600 }}>
                {meta.title}{hadDifficulty ? ' · Tuvo dificultades durante el aprendizaje' : ''}
              </div>
            </div>;
          })}
        </div>
        <PrimaryBtn onClick={onNewSession}>Nueva sesión</PrimaryBtn>
      </div>
    </div>
  );
}

// ─── APP ROOT ────────────────────────────────────────────────────────────────
function App() {
  const [screen, setScreen] = useState('config');
  const [dbText, setDbText] = useState("");
  const [wordDose, setWordDose] = useState(10);
  const [words, setWords] = useState([]);
  const [blocks, setBlocks] = useState([]);
  const [blockIdx, setBlockIdx] = useState(0);
  const [roundOrder, setRoundOrder] = useState([]);
  const [roundPos, setRoundPos] = useState(0);
  const [studyPhase, setStudyPhase] = useState(1);
  const [testQueue, setTestQueue] = useState([]);
  const [testIdx, setTestIdx] = useState(0);
  const [choiceQueue, setChoiceQueue] = useState([]);
  const [choiceIdx, setChoiceIdx] = useState(0);
  const [testResults, setTestResults] = useState({});
  const [wordStats, setWordStats] = useState({});
  const loadedRef = useRef(false);

  // Cargar configuración y sesión guardadas
  useEffect(() => {
    const cfg = loadConfig();
    if (cfg) {
      setDbText(cfg.dbText || "");
      if (cfg.wordDose !== undefined) setWordDose(cfg.wordDose);
    }
    const sess = loadSession();
    const resumableScreens = ['study', 'blockDone', 'finalTest', 'finalChoices'];
    if (sess && resumableScreens.includes(sess.screen)) {
      setWords(sess.words || []);
      setBlocks(sess.blocks || []);
      setBlockIdx(sess.blockIdx || 0);
      setRoundOrder(sess.roundOrder || []);
      setRoundPos(sess.roundPos || 0);
      setStudyPhase(sess.studyPhase || 1);
      setTestQueue(sess.testQueue || []);
      setTestIdx(sess.testIdx || 0);
      setChoiceQueue(sess.choiceQueue || []);
      setChoiceIdx(sess.choiceIdx || 0);
      setTestResults(sess.testResults || {});
      setWordStats(sess.wordStats || {});
      setScreen(sess.screen);
    } else if (sess && sess.screen && sess.screen !== 'config' && sess.screen !== 'result') {
      // Las sesiones de la versión anterior usaban una fase de recall por bloque.
      clearSession();
    }
    loadedRef.current = true;
  }, []);

  // Guardar configuración automáticamente
  useEffect(() => { if (loadedRef.current) saveConfig({ dbText, wordDose }); }, [dbText, wordDose]);

  // Guardar sesión automáticamente
  useEffect(() => {
    if (!loadedRef.current) return;
    if (screen === 'config' || screen === 'result') return;
    saveSession({ screen, words, blocks, blockIdx, roundOrder, roundPos, studyPhase, testQueue, testIdx, choiceQueue, choiceIdx, testResults, wordStats });
  }, [screen, blocks, blockIdx, roundOrder, roundPos, studyPhase, testQueue, testIdx, choiceQueue, choiceIdx, testResults, wordStats, words]);

  function markStat(furigana, fails) {
    setWordStats(prev => {
      const cur = prev[furigana] || { errors: 0, copied: false };
      const next = { ...cur };
      if (fails >= 2) next.copied = true;
      next.errors = Math.max(next.errors, fails);
      return { ...prev, [furigana]: next };
    });
  }

  function startSession() {
    const parsed = parseInput(dbText);
    if (parsed.words.length === 0) return;
    const doseNum = wordDose === 'all' ? parsed.words.length : Number(wordDose);
    const shuffled = shuffle(parsed.words);
    const blocksArr = [];
    for (let i = 0; i < shuffled.length; i += doseNum) blocksArr.push(shuffled.slice(i, i + doseNum));
    setWords(parsed.words);
    setBlocks(blocksArr);
    setBlockIdx(0); setStudyPhase(1);
    setRoundOrder(shuffle(blocksArr[0].map((_, i) => i))); setRoundPos(0);
    setTestQueue([]); setTestIdx(0); setChoiceQueue([]); setChoiceIdx(0); setTestResults({});
    setWordStats({});
    setScreen('study');
  }

  function resetAll() {
    clearAll();
    setDbText(""); setWordDose(10);
    setWords([]); setBlocks([]); setBlockIdx(0); setRoundOrder([]); setRoundPos(0); setStudyPhase(1);
    setTestQueue([]); setTestIdx(0); setChoiceQueue([]); setChoiceIdx(0); setTestResults({});
    setWordStats({});
    setScreen('config');
  }

  function exitSession() { clearSession(); setScreen('config'); }

  // Avanza dentro de la ronda actual y, al terminar el bloque, pasa al siguiente.
  function advanceRound() {
    const block = blocks[blockIdx];
    if (roundPos + 1 < roundOrder.length) {
      setRoundPos(p => p + 1);
      return;
    }
    if (studyPhase < 4) {
      setRoundOrder(shuffle(block.map((_, i) => i)));
      setRoundPos(0);
      setStudyPhase(sp => sp + 1);
      return;
    }
    afterBlockComplete();
  }

  function nextStudyStep(fails) {
    if (studyPhase === 3 || studyPhase === 4) {
      const block = blocks[blockIdx];
      const w = block[roundOrder[roundPos]];
      if (fails) markStat(w.furigana, fails);
    }
    advanceRound();
  }

  function onRecognitionResult(success) {
    const block = blocks[blockIdx];
    const w = block[roundOrder[roundPos]];
    if (!success) markStat(w.furigana, 1);
    advanceRound();
  }

  function onTestWriteResult(success) {
    const w = testQueue[testIdx];
    setTestResults(prev => ({ ...prev, [w.furigana]: { ...(prev[w.furigana] || {}), writing: success } }));
    if (testIdx + 1 < testQueue.length) {
      setTestIdx(i => i + 1);
      return;
    }
    const failedWords = testQueue.filter((word, i) => i === testIdx ? !success : !testResults[word.furigana]?.writing);
    const queue = buildFinalChoiceQueue(failedWords, words);
    setChoiceQueue(queue); setChoiceIdx(0);
    if (queue.length) setScreen('finalChoices');
    else { clearSession(); setScreen('result'); }
  }

  function onTestChoiceResult(success) {
    const q = choiceQueue[choiceIdx];
    const key = q.type === 'word2sig' ? 'jpToEs' : 'esToJp';
    setTestResults(prev => ({ ...prev, [q.word.furigana]: { ...(prev[q.word.furigana] || {}), [key]: success } }));
    if (choiceIdx + 1 < choiceQueue.length) setChoiceIdx(i => i + 1);
    else { clearSession(); setScreen('result'); }
  }

  function afterBlockComplete() {
    if (blockIdx + 1 < blocks.length) {
      const nextIdx = blockIdx + 1;
      setBlockIdx(nextIdx); setStudyPhase(1);
      setRoundOrder(shuffle(blocks[nextIdx].map((_, i) => i))); setRoundPos(0);
      setScreen('blockDone');
    } else {
      setTestQueue(shuffle(words)); setTestIdx(0); setChoiceQueue([]); setChoiceIdx(0); setTestResults({});
      setScreen('finalTest');
    }
  }

  // ---- RENDER ----
  if (screen === 'config') {
    return <ConfigScreen dbText={dbText} setDbText={setDbText} wordDose={wordDose} setWordDose={setWordDose} onStart={startSession} onReset={resetAll} />;
  }

  if (screen === 'blockDone') {
    const justDone = blocks[blockIdx - 1] || [];
    return <BlockTransitionScreen block={justDone} blockDone={blockIdx} blockTotal={blocks.length} onContinue={() => setScreen('study')} onExit={exitSession} />;
  }

  if (screen === 'result') {
    return <ResultScreen words={words} wordStats={wordStats} testResults={testResults} onNewSession={() => setScreen('config')} onExit={exitSession} />;
  }

  if (screen === 'study') {
    const block = blocks[blockIdx] || [];
    const idx = roundOrder[roundPos];
    const word = block[idx];
    if (!word) return null;
    const roundNames = { 1: "Exposición", 2: "Reconocimiento", 3: "Construcción", 4: "Escritura" };
    return (
      <div style={{ flex: 1, display: "flex", flexDirection: "column" }}>
        <TopBar onExit={exitSession} />
        <div style={{ padding: "12px 20px 0" }}>
          <ProgressBar current={roundPos + 1} total={roundOrder.length} />
          <div style={{ fontSize: 10, color: C.textDim, marginTop: 4 }}>
            Bloque {blockIdx + 1}/{blocks.length} · Ronda {roundNames[studyPhase]} ({studyPhase}/4) · Palabra {roundPos + 1}/{roundOrder.length}
          </div>
        </div>
        <div style={{ flex: 1, display: "flex", flexDirection: "column" }}>
          {studyPhase === 1 && <ExposicionEx key={`e-${blockIdx}-${idx}`} word={word} onNext={() => nextStudyStep()} />}
          {studyPhase === 2 && <ReconocimientoEx key={`r-${blockIdx}-${idx}`} word={word} blockWords={block} globalWords={words} onNext={onRecognitionResult} />}
          {studyPhase === 3 && <ConstruccionEx key={`c-${blockIdx}-${idx}`} word={word} onNext={fails => nextStudyStep(fails)} />}
          {studyPhase === 4 && <EscrituraEx key={`w-${blockIdx}-${idx}`} word={word} onNext={fails => nextStudyStep(fails)} />}
        </div>
      </div>
    );
  }

  if (screen === 'finalTest') {
    const w = testQueue[testIdx];
    if (!w) return null;
    return (
      <div style={{ flex: 1, display: "flex", flexDirection: "column", background: C.challenge }}>
        <TopBar onExit={exitSession} title="Test final · Escritura" />
        <div style={{ padding: "12px 20px 0" }}>
          <ProgressBar current={testIdx + 1} total={testQueue.length} color={`linear-gradient(90deg, ${C.challengeDeep}, ${C.pink})`} />
          <div style={{ fontSize: 10, color: C.challengeText, marginTop: 4, fontWeight: 700 }}>
            Escribe la palabra sin pistas · {testIdx + 1}/{testQueue.length}
          </div>
        </div>
        <div style={{ flex: 1, display: "flex", flexDirection: "column" }}>
          <TestWrite key={`test-write-${testIdx}`} word={w} onNext={onTestWriteResult} />
        </div>
      </div>
    );
  }

  if (screen === 'finalChoices') {
    const q = choiceQueue[choiceIdx];
    if (!q) return null;
    const stage = q.type === 'word2sig' ? 'Japonés → español' : 'Español → japonés';
    return (
      <div style={{ flex: 1, display: "flex", flexDirection: "column", background: C.challenge }}>
        <TopBar onExit={exitSession} title="Test final · Alternativas" />
        <div style={{ padding: "12px 20px 0" }}>
          <ProgressBar current={choiceIdx + 1} total={choiceQueue.length} color={`linear-gradient(90deg, ${C.challengeDeep}, ${C.pink})`} />
          <div style={{ fontSize: 10, color: C.challengeText, marginTop: 4, fontWeight: 700 }}>{stage} · {choiceIdx + 1}/{choiceQueue.length}</div>
        </div>
        <div style={{ flex: 1, display: "flex", flexDirection: "column" }}>
          <TestChoiceEx key={`test-choice-${choiceIdx}`} question={q} onNext={onTestChoiceResult} />
        </div>
      </div>
    );
  }

  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
