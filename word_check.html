<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Word Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; background: #eaf6ef; }
  body { display:flex; justify-content:center; font-family:'DM Sans',sans-serif; color:#173b2d; }
  #root { width:100%; max-width:430px; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; background:#f7fcf8; }
  button, input, textarea { font:inherit; }
  button { -webkit-appearance:none; appearance:none; transition:transform .1s, background .2s, border-color .2s; }
  button:not(:disabled):active { transform:scale(.975); }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline:2px solid #65bfa3; outline-offset:2px; }
  .jp { font-family:'Noto Sans JP',sans-serif; }
</style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const {useEffect, useRef, useState} = React;

const C = { bg:'#f7fcf8', alt:'#edf8f1', card:'#fff', deep:'#dcefe4', text:'#173b2d', muted:'#5e8070', dim:'#98b8a8', mint:'#65bfa3', mintDark:'#3f9b7d', mintBg:'rgba(101,191,163,.14)', border:'#c9e5d6', light:'#e1f1e8', pink:'#ef7ca8', pinkDark:'#ce4d7d', pinkBg:'rgba(239,124,168,.14)', yellow:'#d99a35', yellowBg:'#fff8e8', shadow:'0 2px 12px rgba(39,111,82,.10)' };
const SMALL = new Set(['ゃ','ゅ','ょ','ぁ','ぃ','ぅ','ぇ','ぉ','ャ','ュ','ョ','ァ','ィ','ゥ','ェ','ォ']);
const shuffle = arr => [...arr].sort(() => Math.random() - .5);
function splitMoras(text) { const chars=[...text], out=[]; for(let i=0;i<chars.length;i++){ if(SMALL.has(chars[i])) {out.push(chars[i]); continue;} if(i+1<chars.length && SMALL.has(chars[i+1])) {out.push(chars[i]+chars[i+1]);i++;} else out.push(chars[i]); } return out; }
function parse(text) { const errors=[], words=[]; text.split('\n').map(x=>x.trim()).filter(Boolean).forEach((line,i)=>{const p=line.split(';'); const furigana=(p.shift()||'').trim(); const es=p.join(';').trim(); if(!furigana||!es) errors.push(i+1); else words.push({id:`${i}-${furigana}`,furigana,es,moras:splitMoras(furigana)});}); return {words,errors}; }

function Btn({children,onClick,disabled=false,quiet=false}) { return <button disabled={disabled} onClick={onClick} style={{width:'100%',border:quiet?`1.5px solid ${C.border}`:'none',borderRadius:14,padding:'16px',background:quiet?C.card:`linear-gradient(135deg,${C.mintDark},${C.mint})`,color:quiet?C.muted:'#fff',fontWeight:600,fontSize:16,cursor:disabled?'not-allowed':'pointer',boxShadow:quiet?'none':C.shadow,opacity:disabled?.55:1}}>{children}</button>; }
function Top({onExit,title='✓ Word Check'}) { return <header style={{padding:'13px 18px',background:C.card,borderBottom:`1px solid ${C.light}`,display:'flex',justifyContent:'space-between',alignItems:'center'}}><strong style={{fontSize:15}}>{title}</strong>{onExit&&<button onClick={onExit} style={{border:`1px solid ${C.border}`,background:C.alt,borderRadius:8,padding:'6px 11px',color:C.muted,cursor:'pointer',fontSize:12}}>Salir</button>}</header>; }
function Progress({now,total,label}) { return <div style={{padding:'13px 20px 0'}}><div style={{height:5,borderRadius:9,background:C.deep,overflow:'hidden'}}><div style={{height:'100%',width:`${total?Math.round(now/total*100):0}%`,background:`linear-gradient(90deg,${C.mintDark},${C.mint})`,transition:'width .3s'}} /></div><div style={{fontSize:11,color:C.dim,marginTop:5}}>{label} · {now}/{total}</div></div>; }
function Meaning({word}) { return <div style={{padding:'17px 20px',borderRadius:14,background:C.card,border:`1px solid ${C.light}`,boxShadow:C.shadow,textAlign:'center'}}><div style={{color:C.dim,textTransform:'uppercase',letterSpacing:'.1em',fontWeight:600,fontSize:10,marginBottom:5}}>Significado</div><div style={{fontSize:17,lineHeight:1.45}}>{word.es}</div></div>; }
function Feedback({correct,answer,onContinue}) { return <div style={{marginTop:14,textAlign:'center',padding:'14px',borderRadius:13,background:correct?C.mintBg:C.pinkBg,border:`1px solid ${correct?C.mint:C.pink}`}}><strong style={{color:correct?C.mintDark:C.pinkDark}}>{correct?'✓ Correcto':'La respuesta correcta es:'}</strong>{!correct&&<div className="jp" style={{fontSize:25,letterSpacing:'.12em',margin:'5px 0 12px'}}>{answer}</div>}{!correct&&<Btn onClick={onContinue}>Continuar →</Btn>}</div>; }

function Config({text,setText,onStart,onReset}) { const p=parse(text); return <div style={{flex:1,display:'flex',flexDirection:'column'}}><Top/><main style={{padding:'28px 20px',display:'flex',flexDirection:'column',gap:18,flex:1}}><section style={{textAlign:'center'}}><div style={{fontSize:40,marginBottom:8}}>✓</div><h1 style={{fontSize:25,letterSpacing:'-.04em'}}>Comprueba lo que recuerdas</h1><p style={{fontSize:13,color:C.muted,lineHeight:1.55,margin:'8px auto 0',maxWidth:330}}>Las palabras que escribas bien a la primera quedan fuera. Solo repasaremos las que lo necesiten.</p></section><section style={{background:C.card,border:`1px solid ${C.light}`,borderRadius:15,padding:16,boxShadow:C.shadow}}><label style={{fontSize:12,fontWeight:600}}>Tus palabras</label><p style={{fontSize:11,color:C.dim,margin:'4px 0 10px'}}>Una por línea: <span className="jp">lectura;significado</span></p><textarea value={text} onChange={e=>setText(e.target.value)} spellCheck="false" placeholder={'じょうしき;sentido común\nだいじょうぶ;está bien'} style={{width:'100%',minHeight:190,resize:'vertical',padding:12,borderRadius:10,border:`1.5px solid ${p.errors.length?C.pink:C.border}`,background:C.alt,color:C.text,lineHeight:1.8,fontFamily:"'Noto Sans JP', sans-serif",fontSize:13}} />{p.errors.length>0&&<p style={{fontSize:11,color:C.pinkDark,marginTop:7}}>Revisa las líneas: {p.errors.join(', ')}.</p>}<p style={{fontSize:11,color:C.muted,marginTop:8}}>{p.words.length} palabra{p.words.length===1?'':'s'} lista{p.words.length===1?'':'s'}</p></section><div style={{marginTop:'auto',display:'flex',flexDirection:'column',gap:10}}><Btn disabled={!p.words.length} onClick={onStart}>Empezar comprobación →</Btn><Btn quiet onClick={onReset}>Borrar palabras guardadas</Btn></div></main></div>; }

function WriteExercise({word,onResult,stage}) { const [value,setValue]=useState(''); const [result,setResult]=useState(null); const ref=useRef(null); useEffect(()=>setTimeout(()=>ref.current?.focus(),100),[]); function check(){if(!value.trim()||result)return; const ok=value.trim()===word.furigana; setResult(ok); if(ok) setTimeout(()=>onResult(true),650);} return <ExerciseShell word={word} title={stage==='filter'?'Escribe la palabra':'Vuelve a escribir la palabra'} hint={stage==='filter'?'Este es el filtro: si aciertas, no volverá a aparecer.':'Sin mirar las moras.'}><Meaning word={word}/><input ref={ref} className="jp" value={value} onChange={e=>setValue(e.target.value)} onKeyDown={e=>e.key==='Enter'&&check()} disabled={result!==null} placeholder="Escribe aquí…" style={{padding:'15px',fontSize:23,textAlign:'center',letterSpacing:'.12em',borderRadius:13,border:`1.5px solid ${result===false?C.pink:result===true?C.mint:C.border}`,background:C.card,color:C.text}} />{result===null&&<Btn disabled={!value.trim()} onClick={check}>Comprobar</Btn>}{result!==null&&<Feedback correct={result} answer={word.furigana} onContinue={()=>onResult(false)}/>}</ExerciseShell>; }
function ExerciseShell({word,title,hint,children}) { return <main style={{flex:1,padding:'20px 20px 30px',display:'flex',justifyContent:'center',flexDirection:'column',gap:17}}><div style={{textAlign:'center'}}><div style={{color:C.mintDark,fontWeight:700,fontSize:12,textTransform:'uppercase',letterSpacing:'.1em'}}>{title}</div><p style={{fontSize:12,color:C.muted,marginTop:6}}>{hint}</p></div>{children}</main>; }

function MoraExercise({word,onDone}) { const [slots,setSlots]=useState(word.moras.map(()=>null)); const [pool,setPool]=useState(()=>shuffle(word.moras.map((m,i)=>({m,i,used:false})))); const [wrong,setWrong]=useState(null); const [finished,setFinished]=useState(false); function pick(i){if(finished||pool[i].used)return;const empty=slots.findIndex(x=>x===null);if(pool[i].m===word.moras[empty]){const next=[...slots];next[empty]=pool[i].m;setSlots(next);setPool(p=>p.map((x,n)=>n===i?{...x,used:true}:x));if(next.every(Boolean)){setFinished(true);setTimeout(onDone,700);}}else{setWrong(i);setTimeout(()=>setWrong(null),500);}} return <ExerciseShell word={word} title="Ordena las moras" hint="Construye la palabra según su significado."><Meaning word={word}/><div style={{display:'flex',justifyContent:'center',flexWrap:'wrap',gap:7}}>{word.moras.map((m,i)=><div key={i} className="jp" style={{minWidth:48,height:49,display:'flex',alignItems:'center',justifyContent:'center',padding:'0 5px',borderRadius:11,border:`2px dashed ${slots[i]?C.mint:C.border}`,background:slots[i]?C.mintBg:'transparent',color:slots[i]?C.mintDark:'transparent',fontSize:20}}>{slots[i]||m}</div>)}</div><div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:9}}>{pool.map((x,i)=>x.used?<div key={x.i}/>:<button key={x.i} className="jp" onClick={()=>pick(i)} style={{height:55,borderRadius:12,border:`1.5px solid ${wrong===i?C.pink:C.border}`,background:wrong===i?C.pinkBg:C.card,color:wrong===i?C.pinkDark:C.text,fontSize:20,cursor:'pointer',boxShadow:C.shadow}}>{x.m}</button>)}</div>{wrong!==null&&<div style={{fontSize:12,textAlign:'center',color:C.pinkDark}}>La palabra correcta es <span className="jp" style={{fontSize:17}}>{word.furigana}</span></div>}{finished&&<div style={{textAlign:'center',color:C.mintDark,fontWeight:700}}>✓ Así se escribe: <span className="jp">{word.furigana}</span></div>}</ExerciseShell>; }

function Choices({word,allWords,onResult}) { const [picked,setPicked]=useState(null); const options=useState(()=>{let other=shuffle(allWords.filter(w=>w.id!==word.id)).slice(0,3); while(other.length<3) other.push({id:'f'+other.length,furigana:['たべる','みる','すき','ほん'][other.length]||'ことば'}); return shuffle([word,...other]);})[0]; function choose(opt){if(picked)return;const ok=opt.id===word.id;setPicked(opt);if(ok)setTimeout(()=>onResult(true),700);} return <ExerciseShell word={word} title="Elige la escritura correcta" hint="Último paso para esta palabra."><Meaning word={word}/><div style={{display:'flex',flexDirection:'column',gap:9}}>{options.map(opt=>{const good=picked&&opt.id===word.id;const bad=picked===opt&&opt.id!==word.id;return <button key={opt.id} className="jp" onClick={()=>choose(opt)} style={{padding:'15px',borderRadius:13,fontSize:21,letterSpacing:'.1em',border:`1.5px solid ${good?C.mint:bad?C.pink:C.border}`,background:good?C.mintBg:bad?C.pinkBg:C.card,color:good?C.mintDark:bad?C.pinkDark:C.text,cursor:picked?'default':'pointer',boxShadow:C.shadow}}>{opt.furigana}</button>})}</div>{picked&&<Feedback correct={picked.id===word.id} answer={word.furigana} onContinue={()=>onResult(false)}/>}</ExerciseShell>; }

function Stat({value,label,color}) { return <div style={{padding:'14px 8px',textAlign:'center',background:C.card,border:`1px solid ${C.light}`,borderRadius:13,boxShadow:C.shadow}}><strong style={{fontSize:23,color}}>{value}</strong><div style={{fontSize:10,color:C.muted,marginTop:3,lineHeight:1.25}}>{label}</div></div>; }
function WordList({title,items,color,empty}) { return <section style={{background:C.card,border:`1px solid ${C.light}`,borderRadius:14,overflow:'hidden',boxShadow:C.shadow}}><header style={{padding:'10px 14px',background:C.alt,borderBottom:`1px solid ${C.light}`,fontSize:11,fontWeight:700,color,textTransform:'uppercase',letterSpacing:'.07em'}}>{title}</header>{items.length?items.map((w,i)=><div key={w.id} style={{padding:'10px 14px',borderBottom:i<items.length-1?`1px solid ${C.light}`:'none',display:'flex',gap:10,alignItems:'center'}}><span className="jp" style={{minWidth:94,fontSize:16}}>{w.furigana}</span><span style={{fontSize:12,color:C.muted,lineHeight:1.35}}>{w.es}</span></div>):<p style={{padding:'12px 14px',fontSize:12,color:C.dim}}>{empty}</p>}</section>; }
function Summary({words,records,onNew}) { const filter=words.filter(w=>records[w.id]?.stage==='filter');const rew=words.filter(w=>records[w.id]?.stage==='rewrite');const choices=words.filter(w=>records[w.id]?.stage==='choice');const unresolved=words.filter(w=>records[w.id]?.stage==='unresolved');const pct=n=>words.length?Math.round(n/words.length*100):0; return <div style={{flex:1,display:'flex',flexDirection:'column'}}><Top title="✓ Word Check · Resultado"/><main style={{padding:'23px 20px 30px',overflowY:'auto',display:'flex',flexDirection:'column',gap:15}}><section style={{textAlign:'center'}}><div style={{fontSize:36}}>✓</div><h1 style={{fontSize:21}}>Resumen final</h1><p style={{fontSize:12,color:C.muted,marginTop:5}}>Así quedó tu comprobación de {words.length} palabra{words.length===1?'':'s'}.</p></section><div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}><Stat value={`${filter.length}/${words.length}`} label={`Bien desde el inicio · ${pct(filter.length)}%`} color={C.mintDark}/><Stat value={`${words.length-filter.length}/${words.length}`} label={`Necesitaron repaso · ${pct(words.length-filter.length)}%`} color={C.yellow}/><Stat value={rew.length} label="Resueltas al reescribir" color={C.mint}/><Stat value={choices.length} label="Resueltas con alternativas" color={C.mint}/></div>{unresolved.length>0&&<div style={{padding:'11px 13px',borderRadius:12,background:C.pinkBg,color:C.pinkDark,fontSize:12}}>{unresolved.length} palabra{unresolved.length===1?' sigue':'s siguen'} pendiente{unresolved.length===1?'':'s'} tras las alternativas.</div>}<WordList title={`Correctas desde el inicio · ${pct(filter.length)}%`} items={filter} color={C.mintDark} empty="No hubo palabras correctas en el filtro inicial."/><WordList title="Repaso completado al reescribir" items={rew} color={C.mintDark} empty="Ninguna en esta etapa."/><WordList title="Alternativas" items={[...choices,...unresolved]} color={unresolved.length?C.pinkDark:C.yellow} empty="Ninguna palabra llegó a alternativas."/><Btn onClick={onNew}>Nueva comprobación</Btn></main></div>; }

function App(){const [text,setText]=useState(()=>localStorage.getItem('word_check_text')||'');const [screen,setScreen]=useState('config');const [words,setWords]=useState([]);const [queue,setQueue]=useState([]);const [index,setIndex]=useState(0);const [records,setRecords]=useState({});useEffect(()=>localStorage.setItem('word_check_text',text),[text]);function start(){const p=parse(text);setWords(p.words);setQueue(shuffle(p.words));setIndex(0);setRecords({});setScreen('filter');}function saveRecord(word,stage){setRecords(r=>({...r,[word.id]:{stage}}));}function nextFilter(ok){const w=queue[index];if(ok)saveRecord(w,'filter');else setQueue(q=>q);if(index+1<queue.length)setIndex(index+1);else{const review=queue.filter(x=>!records[x.id]&&x.id!==w.id);if(!ok)review.push(w);setQueue(shuffle(review));setIndex(0);setScreen(review.length?'moras':'summary');}}function nextMora(){if(index+1<queue.length)setIndex(index+1);else{setQueue(shuffle(queue));setIndex(0);setScreen('rewrite');}}function nextRewrite(ok){const w=queue[index];if(ok)saveRecord(w,'rewrite');else saveRecord(w,'toChoice');if(index+1<queue.length)setIndex(index+1);else{const choice=queue.filter(x=>records[x.id]?.stage==='toChoice'||x.id===w.id&&!ok);setQueue(shuffle(choice));setIndex(0);setScreen(choice.length?'choices':'summary');}}function nextChoice(ok){const w=queue[index];saveRecord(w,ok?'choice':'unresolved');if(index+1<queue.length)setIndex(index+1);else setScreen('summary');}function exit(){setScreen('config');}if(screen==='config')return <Config text={text} setText={setText} onStart={start} onReset={()=>setText('')}/>;if(screen==='summary')return <Summary words={words} records={records} onNew={exit}/>;const w=queue[index];if(!w)return null;const labels={filter:'Filtro inicial',moras:'Moras',rewrite:'Escritura de nuevo',choices:'Alternativas'};return <div style={{flex:1,display:'flex',flexDirection:'column'}}><Top onExit={exit}/><Progress now={index+1} total={queue.length} label={labels[screen]}/>{screen==='filter'&&<WriteExercise key={w.id} word={w} stage="filter" onResult={nextFilter}/>} {screen==='moras'&&<MoraExercise key={w.id} word={w} onDone={nextMora}/>} {screen==='rewrite'&&<WriteExercise key={w.id} word={w} stage="rewrite" onResult={nextRewrite}/>} {screen==='choices'&&<Choices key={w.id} word={w} allWords={words} onResult={nextChoice}/>}</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
