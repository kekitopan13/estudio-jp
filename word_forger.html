<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link rel="preconnect" href="https://fonts.googleapis.com">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #f0faf6; }
  body {
    font-family: 'DM Sans', sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    background: #e8f6f0;
  }
  #root {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: #f7fdfb;
    position: relative;
  }
  .kanji-font { font-family: 'Noto Serif JP', serif; }
  .jp-font { font-family: 'Noto Sans JP', sans-serif; }

button:active{
  transform:scale(0.97);
  filter:brightness(0.96);
}

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ─── HELPERS ────────────────────────────────────────────────────────────────
function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

const SMALL_KANA = new Set(['ゃ','ゅ','ょ','ぁ','ぃ','ぅ','ぇ','ぉ','ャ','ュ','ョ','ァ','ィ','ゥ','ェ','ォ']);

// Divide una palabra en moras. しゃしゅしょ etc. quedan como una sola pieza,
// っ / ん / ー / vocales largas quedan siempre como piezas independientes.
function splitMoras(str) {
  const chars = [...str];
  const moras = [];
  for (let i = 0; i < chars.length; i++) {
    const ch = chars[i];
    if (SMALL_KANA.has(ch)) { moras.push(ch); continue; } // huérfano, caso raro
    if (i + 1 < chars.length && SMALL_KANA.has(chars[i + 1])) {
      moras.push(ch + chars[i + 1]);
      i++;
    } else {
      moras.push(ch);
    }
  }
  return moras;
}

const FALLBACK_MORAS = ['あ','い','う','え','お','か','き','く','け','こ','さ','し','す','せ','そ',
  'た','ち','つ','て','と','な','に','ぬ','ね','の','は','ひ','ふ','へ','ほ',
  'ま','み','む','め','も','や','ゆ','よ','ら','り','る','れ','ろ','わ','ん'];

// ─── COLORES (idénticos a aprendizaje.html) ─────────────────────────────────
const C = {
  bg:          "#f7fdfb",
  bgAlt:       "#edf7f3",
  bgCard:      "#ffffff",
  bgDeep:      "#e4f5ef",
  text:        "#1a2e28",
  textMuted:   "#5a7a72",
  textDim:     "#9bbdb5",
  mint:        "#B3EEE3",
  mintDark:    "#7dd4c4",
  mintDeep:    "#4fbfac",
  pink:        "#FA7DB3",
  pinkLight:   "rgba(250,125,179,0.15)",
  pinkDark:    "#e8609a",
  correct:     "#4fbfac",
  correctBg:   "rgba(79,191,172,0.12)",
  wrong:       "#FA7DB3",
  wrongBg:     "rgba(250,125,179,0.15)",
  border:      "#c8e8e0",
  borderLight: "#dff2ed",
  white:       "#ffffff",
  shadow:      "0 2px 12px rgba(79,191,172,0.12)",
  shadowCard:  "0 1px 4px rgba(0,0,0,0.06)",
  yellow:      "#fffbe6",
  yellowBorder:"#f0d060",
  yellowText:  "#8a7020",
  challenge:   "#fff3e0",
  challengeBorder: "#ffb74d",
  challengeText: "#e65100",
  challengeDeep: "#f57c00",
};

// ─── PARSEO DE ENTRADA ───────────────────────────────────────────────────────
// Formato: furigana;significado (una pareja por línea)
function parseInput(text) {
  const lines = (text || "").split("\n").map(l => l.trim()).filter(Boolean);
  const words = [];
  const errors = [];
  lines.forEach((line, idx) => {
    const parts = line.split(";");
    if (parts.length < 2) { errors.push(idx + 1); return; }
    const furigana = parts[0].trim();
    const es = parts.slice(1).join(";").trim().replace(/"/g, "");
    if (!furigana || !es) { errors.push(idx + 1); return; }
    words.push({ furigana, es, moras: splitMoras(furigana) });
  });
  return { words, errors };
}

// ─── PERSISTENCIA ────────────────────────────────────────────────────────────
const CONFIG_KEY = "word_forge_config";
const SESSION_KEY = "word_forge_session";

function saveConfig(cfg) { try { localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg)); } catch(e) {} }
function loadConfig() { try { const raw = localStorage.getItem(CONFIG_KEY); return raw ? JSON.parse(raw) : null; } catch(e) { return null; } }
function saveSession(state) { try { localStorage.setItem(SESSION_KEY, JSON.stringify(state)); } catch(e) {} }
function loadSession() { try { const raw = localStorage.getItem(SESSION_KEY); return raw ? JSON.parse(raw) : null; } catch(e) { return null; } }
function clearSession() { try { localStorage.removeItem(SESSION_KEY); } catch(e) {} }
function clearAll() { try { localStorage.removeItem(SESSION_KEY); localStorage.removeItem(CONFIG_KEY); } catch(e) {} }

// ─── COMPONENTES COMPARTIDOS ─────────────────────────────────────────────────
function PrimaryBtn({ onClick, children, disabled }) {
  return (
    <button onClick={onClick} disabled={disabled} style={{
      width: "100%", padding: "17px",
      background: disabled ? C.bgDeep : `linear-gradient(135deg, ${C.mintDeep}, ${C.mintDark})`,
      border: "none", borderRadius: 14,
      color: disabled ? C.textDim : C.white,
      fontSize: 17, fontWeight: 600,
      cursor: disabled ? "not-allowed" : "pointer",
      fontFamily: "'DM Sans', sans-serif",
      boxShadow: disabled ? "none" : C.shadow,
      transition: "transform 0.1s",
    }}
    onPointerDown={e => { if (!disabled) e.currentTarget.style.transform = "scale(0.97)"; }}
    onPointerUp={e => e.currentTarget.style.transform = "scale(1)"}
    onPointerLeave={e => e.currentTarget.style.transform = "scale(1)"}
    >{children}</button>
  );
}

function TopBar({ title = "🔨 Word Forge", onExit }) {
  return (
    <div style={{
      padding: "12px 16px",
      display: "flex", alignItems: "center", justifyContent: "space-between",
      background: C.white, borderBottom: `1px solid ${C.borderLight}`,
    }}>
      <span style={{ fontSize: 15, fontWeight: 600, color: C.text }}>{title}</span>
      {onExit && (
        <button onClick={onExit} style={{
          padding: "6px 12px", borderRadius: 8,
          background: C.bgDeep, border: `1px solid ${C.border}`,
          color: C.textMuted, fontSize: 12, cursor: "pointer",
          fontFamily: "'DM Sans', sans-serif",
        }}>Salir</button>
      )}
    </div>
  );
}

function ProgressBar({ current, total, color }) {
  const pct = total > 0 ? Math.round((current / total) * 100) : 0;
  return (
    <div style={{ height: 5, background: C.bgDeep, borderRadius: 3, overflow: "hidden" }}>
      <div style={{
        height: "100%", width: `${pct}%`,
        background: color || `linear-gradient(90deg, ${C.mintDeep}, ${C.pink})`,
        borderRadius: 3, transition: "width 0.4s ease",
      }} />
    </div>
  );
}

function HintBanner({ mora }) {
  return (
    <div style={{ textAlign: "center", fontSize: 12, color: C.textMuted }}>
      Pista: mora revelada:{" "}
      <span className="jp-font" style={{ color: C.mintDeep, fontWeight: 700, fontSize: 16 }}>{mora}</span>
    </div>
  );
}

function CopyGate({ target, onDone }) {
  const [input, setInput] = useState("");
  const [shake, setShake] = useState(false);
  function submit() {
    if (input.trim() === target) { onDone(); }
    else { setShake(true); setTimeout(() => setShake(false), 400); }
  }
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14, padding: "14px 0" }}>
      <div style={{ textAlign: "center", fontSize: 12, color: C.textMuted, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.08em" }}>
        Copia la palabra para continuar
      </div>
      <div className="jp-font" style={{
        textAlign: "center", fontSize: 26, color: C.text, letterSpacing: "0.15em",
        background: C.bgCard, borderRadius: 14, padding: "14px",
        border: `1px solid ${C.borderLight}`, boxShadow: C.shadowCard,
      }}>{target}</div>
      <input
        value={input}
        onChange={e => setInput(e.target.value)}
        onKeyDown={e => { if (e.key === "Enter") submit(); }}
        placeholder="Escribe aquí..."
        className="jp-font"
        style={{
          padding: "16px 18px", borderRadius: 13, fontSize: 20,
          background: C.bgCard, border: `1.5px solid ${shake ? C.pink : C.border}`,
          color: C.text, outline: "none", textAlign: "center", letterSpacing: "0.15em",
          fontFamily: "'Noto Sans JP', sans-serif",
        }}
      />
      <PrimaryBtn onClick={submit} disabled={!input}>Verificar</PrimaryBtn>
    </div>
  );
}

function MeaningCard({ text }) {
  return (
    <div style={{
      background: C.bgCard, borderRadius: 14, padding: "18px 20px",
      border: `1px solid ${C.borderLight}`, boxShadow: C.shadowCard, textAlign: "center",
    }}>
      <div style={{ fontSize: 10, color: C.textDim, marginBottom: 4, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.1em" }}>Significado</div>
      <div style={{ fontSize: 17, color: C.text, lineHeight: 1.5 }}>{text}</div>
    </div>
  );
}

// ─── FASE 1: EXPOSICIÓN ──────────────────────────────────────────────────────
function ExposicionEx({ word, onNext }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", padding: "20px 24px 28px", gap: 18, flex: 1, justifyContent: "center" }}>
      <div style={{ textAlign: "center" }}>
        <div className="jp-font" style={{ fontSize: 44, color: C.text, letterSpacing: "0.12em" }}>{word.furigana}</div>
      </div>
      <MeaningCard text={word.es} />
      <PrimaryBtn onClick={onNext}>OK</PrimaryBtn>
    </div>
  );
}

// ─── FASE 2: RECONOCIMIENTO ──────────────────────────────────────────────────
function ReconocimientoEx({ word, blockWords, globalWords, onNext }) {
  const [options] = useState(() => {
    const others = blockWords.filter(w => w.furigana !== word.furigana);
    let distractor;
    if (others.length) distractor = shuffle(others)[0];
    else {
      const globalOthers = (globalWords || []).filter(w => w.furigana !== word.furigana);
      distractor = globalOthers.length ? shuffle(globalOthers)[0] : word;
    }
    return shuffle([word, distractor]);
  });
  const [chosen, setChosen] = useState(null);
  const [wrong, setWrong] = useState(false);

  function pick(opt) {
    if (chosen) return;
    setChosen(opt);
    const success = opt.furigana === word.furigana;
    if (!success) setWrong(true);
    setTimeout(() => onNext(success), success ? 550 : 1100);
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", padding: "20px 20px 28px", gap: 24, flex: 1, justifyContent: "center" }}>
      <MeaningCard text={word.es} />
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {options.map((opt, i) => {
          const isCorrectShown = wrong && opt.furigana === word.furigana;
          const isChosenWrong = chosen === opt && wrong;
          return (
            <button key={i} onClick={() => pick(opt)} className="jp-font" style={{
              padding: "18px 20px", borderRadius: 13, fontSize: 22,
              background: isCorrectShown ? C.correctBg : isChosenWrong ? C.wrongBg : C.bgCard,
              border: `1.5px solid ${isCorrectShown ? C.mintDeep : isChosenWrong ? C.pink : C.border}`,
              color: isCorrectShown ? C.mintDeep : isChosenWrong ? C.pinkDark : C.text,
              cursor: chosen ? "default" : "pointer", letterSpacing: "0.15em", textAlign: "center",
              fontFamily: "'Noto Sans JP', sans-serif", boxShadow: C.shadowCard,
            }}>{opt.furigana}</button>
          );
        })}
      </div>
    </div>
  );
}

// ─── FASE 3: CONSTRUCCIÓN ────────────────────────────────────────────────────
function ConstruccionEx({ word, onNext }) {
  const moras = word.moras;
  const [slots, setSlots] = useState(moras.map(() => null));
  const [pool, setPool] = useState(() => shuffle(moras.map((m, i) => ({ m, used: false, key: i }))));
  const [fails, setFails] = useState(0);
  const [showHint, setShowHint] = useState(false);
  const [copyMode, setCopyMode] = useState(false);
  const [done, setDone] = useState(false);

  function handlePick(idx) {
    if (copyMode || done) return;
    const item = pool[idx];
    if (!item || item.used) return;
    const nextEmpty = slots.findIndex(s => s === null);
    if (nextEmpty === -1) return;
    if (item.m === moras[nextEmpty]) {
      const ns = [...slots]; ns[nextEmpty] = item.m; setSlots(ns);
      setPool(p => p.map((it, i) => i === idx ? { ...it, used: true } : it));
      if (ns.every(s => s !== null)) setTimeout(() => setDone(true), 350);
    } else {
      const nf = fails + 1; setFails(nf);
      if (nf === 1) setShowHint(true);
      else setCopyMode(true);
    }
  }

  if (copyMode) {
    return (
      <div style={{ padding: "20px 20px 28px", flex: 1, display: "flex", flexDirection: "column", justifyContent: "center" }}>
        <div style={{ textAlign: "center", fontSize: 14, color: C.textMuted, marginBottom: 10 }}>{word.es}</div>
        <CopyGate target={word.furigana} onDone={() => onNext(2)} />
      </div>
    );
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", padding: "16px 20px 24px", gap: 16, flex: 1, justifyContent: "center" }}>
      <div style={{ textAlign: "center" }}>
        <div style={{ fontSize: 14, color: C.textMuted, marginBottom: 14 }}>{word.es}</div>
        <div style={{ display: "flex", justifyContent: "center", gap: 6, flexWrap: "wrap" }}>
          {moras.map((m, i) => (
            <div key={i} className="jp-font" style={{
              minWidth: 46, height: 46, padding: "0 4px",
              border: `2px dashed ${slots[i] ? C.mintDeep : C.border}`,
              borderRadius: 11, display: "flex", alignItems: "center", justifyContent: "center",
              fontSize: 20, color: slots[i] ? C.mintDeep : "transparent",
              background: slots[i] ? C.correctBg : "transparent", transition: "all 0.2s",
            }}>{slots[i] || m}</div>
          ))}
        </div>
      </div>
      {showHint && <div style={{display:"flex",justifyContent:"center",gap:6,flexWrap:"wrap"}}>{moras.map((m,i)=><div key={i} className="jp-font" style={{minWidth:46,height:46,padding:"0 4px",border:`2px dashed ${C.border}`,borderRadius:11,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,color:i===0?C.mintDeep:"transparent",background:i===0?C.correctBg:"transparent"}}>{i===0?m:""}</div>)}</div>}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 8 }}>
        {pool.map((it, i) => it.used ? <div key={i} style={{ height: 56 }} /> : (
          <button key={i} onClick={() => handlePick(i)} className="jp-font" style={{
            height: 56, fontSize: 20,
            background: C.bgCard, border: `1.5px solid ${C.border}`,
            borderRadius: 12, color: C.text, cursor: "pointer",
            fontFamily: "'Noto Sans JP', sans-serif", boxShadow: C.shadowCard,
          }}>{it.m}</button>
        ))}
      </div>
      {done && <PrimaryBtn onClick={() => onNext(fails)}>Continuar →</PrimaryBtn>}
    </div>
  );
}

// ─── FASE 4: ESCRITURA ───────────────────────────────────────────────────────
function EscrituraEx({ word, onNext }) {
  const [input, setInput] = useState("");
  const [fails, setFails] = useState(0);
  const [showHint, setShowHint] = useState(false);
  const [copyMode, setCopyMode] = useState(false);
  const [shake, setShake] = useState(false);
  const inputRef = useRef(null);

  useEffect(() => { setTimeout(() => inputRef.current?.focus(), 100); }, []);

  function submit() {
    if (copyMode) return;
    const trimmed = input.trim();
    if (trimmed === word.furigana) { onNext(fails); return; }
    const nf = fails + 1; setFails(nf);
    setShake(true); setTimeout(() => setShake(false), 400);
    if (nf === 1) { setShowHint(true); setInput(""); }
    else { setCopyMode(true); }
  }

  function noRecuerdo() { setFails(2); setCopyMode(true); }

  if (copyMode) {
    return (
      <div style={{ padding: "20px 20px 28px", flex: 1, display: "flex", flexDirection: "column", justifyContent: "center" }}>
        <div style={{ textAlign: "center", fontSize: 14, color: C.textMuted, marginBottom: 10 }}>{word.es}</div>
        <CopyGate target={word.furigana} onDone={() => onNext(2)} />
      </div>
    );
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", padding: "20px 20px 28px", gap: 20, flex: 1, justifyContent: "center" }}>
      <MeaningCard text={word.es} />
      {showHint && <div style={{textAlign:"center",color:C.textMuted,fontSize:13}}>Pista: <span className="jp-font" style={{color:C.mintDeep,fontWeight:700}}>{word.moras[0]}</span></div>}
      <input
        ref={inputRef}
        value={input}
        onChange={e => setInput(e.target.value)}
        onKeyDown={e => { if (e.key === "Enter") submit(); }}
        placeholder="Escribe la palabra..."
        className="jp-font"
        style={{
          padding: "16px 18px", borderRadius: 13, fontSize: 20,
          background: C.bgCard, border: `1.5px solid ${shake ? C.pink : C.border}`,
          color: C.text, outline: "none", textAlign: "center", letterSpacing: "0.15em",
          fontFamily: "'Noto Sans JP', sans-serif",
        }}
      />
      <PrimaryBtn onClick={submit} disabled={!input}>Verificar</PrimaryBtn>
      <button onClick={noRecuerdo} style={{
        background: "none", border: "none", color: C.textMuted, fontSize: 12,
        cursor: "pointer", textDecoration: "underline", fontFamily: "'DM Sans', sans-serif",
      }}>No me acuerdo</button>
    </div>
  );
}

// ─── RONDA CHALLENGING: generación de preguntas ─────────────────────────────
function buildDistractors(w, key, blockWords, seenPool, count) {
  const primary = shuffle(blockWords.filter(x => x.furigana !== w.furigana && x[key] !== w[key]));
  let result = primary.slice(0, count);
  if (result.length < count) {
    const extra = shuffle(seenPool.filter(x =>
      x.furigana !== w.furigana && x[key] !== w[key] && !result.some(r => r[key] === x[key])
    ));
    result = result.concat(extra.slice(0, count - result.length));
  }
  return result.slice(0, count).map(x => x[key]);
}

function buildChallengeQueue(blockWords, seenPool) {
  const allMoras = [...new Set(seenPool.flatMap(w => w.moras))];
  const types = ['sig2word','word2sig','mc4'];
  let typeAssign = [];
  while (typeAssign.length < blockWords.length) typeAssign = typeAssign.concat(shuffle(types));
  typeAssign = shuffle(typeAssign.slice(0, blockWords.length));
  const order = shuffle(blockWords);

  const queue = order.map((w, i) => {
    const type = typeAssign[i];
    if (type === 'sig2word') return { type, word: w };
    if (type === 'word2sig') {
      const distractors = buildDistractors(w, 'es', blockWords, seenPool, 3);
      return { type, word: w, options: shuffle([w.es, ...distractors]) };
    }
    if (type === 'mc4') {
      const distractors = buildDistractors(w, 'furigana', blockWords, seenPool, 3);
      return { type, word: w, options: shuffle([w.furigana, ...distractors]) };
    }
    // moraGap
    const gapIndex = Math.floor(Math.random() * w.moras.length);
    const correct = w.moras[gapIndex];
    let distractors = shuffle(allMoras.filter(m => m !== correct)).slice(0, 3);
    if (distractors.length < 3) {
      const fb = shuffle(FALLBACK_MORAS.filter(m => m !== correct && !distractors.includes(m)));
      distractors = distractors.concat(fb.slice(0, 3 - distractors.length));
    }
    return { type, word: w, gapIndex, options: shuffle([correct, ...distractors]) };
  });

  return shuffle(queue);
}

// ─── COMPONENTES DE PREGUNTAS CHALLENGING ───────────────────────────────────
function ChallengeMC({ label, labelJp, options, optionsJp, correct, onNext }) {
  const [chosen, setChosen] = useState(null);
  const [wrong, setWrong] = useState(false);

  function pick(opt) {
    if (chosen) return;
    setChosen(opt);
    const success = opt === correct;
    if (!success) setWrong(true);
    setTimeout(() => onNext(success), success ? 550 : 1100);
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", padding: "20px 20px 28px", gap: 20, flex: 1, justifyContent: "center" }}>
      <div style={{ background: C.challenge, borderRadius: 14, padding: "18px 20px", border: `1px solid ${C.challengeBorder}`, textAlign: "center" }}>
        <div className={labelJp ? "jp-font" : undefined} style={{ fontSize: labelJp ? 26 : 17, color: C.text, letterSpacing: labelJp ? "0.12em" : "normal" }}>{label}</div>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {options.map((opt, i) => {
          const isCorrectShown = wrong && opt === correct;
          const isChosenWrong = chosen === opt && wrong;
          return (
            <button key={i} onClick={() => pick(opt)} className={optionsJp ? "jp-font" : undefined} style={{
              padding: "15px 18px", borderRadius: 13, fontSize: optionsJp ? 19 : 15,
              background: isCorrectShown ? C.correctBg : isChosenWrong ? C.wrongBg : C.bgCard,
              border: `1.5px solid ${isCorrectShown ? C.mintDeep : isChosenWrong ? C.pink : C.challengeBorder}`,
              color: isCorrectShown ? C.mintDeep : isChosenWrong ? C.pinkDark : C.text,
              cursor: chosen ? "default" : "pointer",
              textAlign: optionsJp ? "center" : "left", lineHeight: 1.4,
              letterSpacing: optionsJp ? "0.12em" : "normal",
              fontFamily: optionsJp ? "'Noto Sans JP', sans-serif" : "'DM Sans', sans-serif",
              boxShadow: C.shadowCard,
            }}>{opt}</button>
          );
        })}
      </div>
    </div>
  );
}

function ChallengeMoraGap({ question, onNext }) {
  const { word, gapIndex, options } = question;
  const correct = word.moras[gapIndex];
  const [chosen, setChosen] = useState(null);
  const [wrong, setWrong] = useState(false);

  function pick(opt) {
    if (chosen) return;
    setChosen(opt);
    const success = opt === correct;
    if (!success) setWrong(true);
    setTimeout(() => onNext(success), success ? 550 : 1100);
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", padding: "20px 20px 28px", gap: 20, flex: 1, justifyContent: "center" }}>
      <div style={{ background: C.challenge, borderRadius: 14, padding: "18px 20px", border: `1px solid ${C.challengeBorder}`, textAlign: "center" }}>
        <div style={{ fontSize: 12, color: C.textMuted, marginBottom: 8 }}>{word.es}</div>
        <div className="jp-font" style={{ display: "flex", justifyContent: "center", gap: 4, flexWrap: "wrap" }}>
          {word.moras.map((m, i) => (
            <span key={i} style={{ fontSize: 24, color: i === gapIndex ? C.challengeDeep : C.text, fontWeight: i === gapIndex ? 700 : 400 }}>
              {i === gapIndex ? "＿" : m}
            </span>
          ))}
        </div>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {options.map((opt, i) => {
          const isCorrectShown = wrong && opt === correct;
          const isChosenWrong = chosen === opt && wrong;
          return (
            <button key={i} onClick={() => pick(opt)} className="jp-font" style={{
              padding: "15px 18px", borderRadius: 13, fontSize: 20,
              background: isCorrectShown ? C.correctBg : isChosenWrong ? C.wrongBg : C.bgCard,
              border: `1.5px solid ${isCorrectShown ? C.mintDeep : isChosenWrong ? C.pink : C.challengeBorder}`,
              color: isCorrectShown ? C.mintDeep : isChosenWrong ? C.pinkDark : C.text,
              cursor: chosen ? "default" : "pointer", textAlign: "center", letterSpacing: "0.12em",
              fontFamily: "'Noto Sans JP', sans-serif", boxShadow: C.shadowCard,
            }}>{opt}</button>
          );
        })}
      </div>
    </div>
  );
}

function ChallengeWrite({ word, onNext }) {
  const [input, setInput] = useState("");
  const [status, setStatus] = useState("idle"); // idle | correct | wrong
  const [fails, setFails] = useState(0);
  const [showAnswer, setShowAnswer] = useState(false);
  const inputRef = useRef(null);

  useEffect(() => { setTimeout(() => inputRef.current?.focus(), 100); }, []);

  function submit() {
    if (status === "correct" || showAnswer) return;
    if (input.trim() === word.furigana) {
      setStatus("correct");
      setTimeout(() => onNext(fails === 0), 550);
    } else {
      const nf = fails + 1; setFails(nf); setStatus("wrong");
      if (nf >= 2) {
        setShowAnswer(true);
        setTimeout(() => onNext(false), 1400);
      } else {
        setTimeout(() => { setStatus("idle"); setInput(""); }, 600);
      }
    }
  }

  const borderColor = status === "correct" ? C.mintDeep : status === "wrong" ? C.pink : C.challengeBorder;
  const bg = status === "correct" ? C.correctBg : status === "wrong" ? C.wrongBg : C.bgCard;

  return (
    <div style={{ display: "flex", flexDirection: "column", padding: "20px 20px 28px", gap: 20, flex: 1, justifyContent: "center" }}>
      <div style={{ background: C.challenge, borderRadius: 14, padding: "18px 20px", border: `1px solid ${C.challengeBorder}`, textAlign: "center" }}>
        <div style={{ fontSize: 17, color: C.text }}>{word.es}</div>
      </div>
      {showAnswer && (
        <div className="jp-font" style={{ textAlign: "center", fontSize: 22, color: C.challengeDeep, fontWeight: 600, letterSpacing: "0.15em" }}>
          {word.furigana}
        </div>
      )}
      <input
        ref={inputRef}
        value={input}
        onChange={e => { setInput(e.target.value); if (status === "wrong") setStatus("idle"); }}
        onKeyDown={e => { if (e.key === "Enter") submit(); }}
        disabled={status === "correct" || showAnswer}
        placeholder="Escribe la palabra..."
        className="jp-font"
        style={{
          padding: "16px 18px", borderRadius: 13, fontSize: 20,
          background: bg, border: `1.5px solid ${borderColor}`, color: C.text,
          outline: "none", textAlign: "center", letterSpacing: "0.15em",
          fontFamily: "'Noto Sans JP', sans-serif",
        }}
      />
      {!showAnswer && <PrimaryBtn onClick={submit} disabled={!input || status === "correct"}>{status === "correct" ? "✓" : "Verificar"}</PrimaryBtn>}
    </div>
  );
}

function ChallengeEx({ question, onNext }) {
  if (question.type === 'sig2word') return <ChallengeWrite word={question.word} onNext={onNext} />;
  if (question.type === 'word2sig') return <ChallengeMC label={question.word.furigana} labelJp options={question.options} correct={question.word.es} onNext={onNext} />;
  if (question.type === 'mc4') return <ChallengeMC label={question.word.es} options={question.options} optionsJp correct={question.word.furigana} onNext={onNext} />;
  if (question.type === 'moraGap') return <ChallengeMoraGap question={question} onNext={onNext} />;
  return null;
}

function ResultScreen({ words, wordStats, onNewSession }) {
  let perfect = 0, hinted = 0, copied = 0;
  const hintedList = [], copiedList = [];
  words.forEach(w => {
    const st = wordStats[w.furigana];
    if (!st || (st.errors === 0 && !st.copied)) perfect++;
    else if (st.copied) { copied++; copiedList.push(w); }
    else { hinted++; hintedList.push(w); }
  });

  return (
    <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>
      <TopBar />

// ─── APP ROOT ────────────────────────────────────────────────────────────────
function App() {
  const [screen, setScreen] = useState('config');
  const [dbText, setDbText] = useState("");
  const [wordDose, setWordDose] = useState(10);
  const [words, setWords] = useState([]);
  const [blocks, setBlocks] = useState([]);
  const [blockIdx, setBlockIdx] = useState(0);
  const [wordIdx, setWordIdx] = useState(0);
  const [studyPhase, setStudyPhase] = useState(1);
  const [challengeQueue, setChallengeQueue] = useState([]);
  const [challengeIdx, setChallengeIdx] = useState(0);
  const [revisionQueue, setRevisionQueue] = useState([]);
  const [wordStats, setWordStats] = useState({});
  const [seenWords, setSeenWords] = useState([]);
  const [fase2Fails, setFase2Fails] = useState([]);
  const loadedRef = useRef(false);

  // Cargar configuración y sesión guardadas
  useEffect(() => {
    const cfg = loadConfig();
    if (cfg) {
      setDbText(cfg.dbText || "");
      if (cfg.wordDose !== undefined) setWordDose(cfg.wordDose);
    }
    const sess = loadSession();
    if (sess && sess.screen && sess.screen !== 'config' && sess.screen !== 'result') {
      setWords(sess.words || []);
      setBlocks(sess.blocks || []);
      setBlockIdx(sess.blockIdx || 0);
      setWordIdx(sess.wordIdx || 0);
      setStudyPhase(sess.studyPhase || 1);
      setChallengeQueue(sess.challengeQueue || []);
      setChallengeIdx(sess.challengeIdx || 0);
      setRevisionQueue(sess.revisionQueue || []);
      setWordStats(sess.wordStats || {});
      setSeenWords(sess.seenWords || []);
      setFase2Fails(sess.fase2Fails || []);
      setScreen(sess.screen);
    }
    loadedRef.current = true;
  }, []);

  // Guardar configuración automáticamente
  useEffect(() => { if (loadedRef.current) saveConfig({ dbText, wordDose }); }, [dbText, wordDose]);

  // Guardar sesión automáticamente
  useEffect(() => {
    if (!loadedRef.current) return;
    if (screen === 'config' || screen === 'result') return;
    saveSession({ screen, words, blocks, blockIdx, wordIdx, studyPhase, challengeQueue, challengeIdx, revisionQueue, wordStats, seenWords, fase2Fails });
  }, [screen, blocks, blockIdx, wordIdx, studyPhase, challengeQueue, challengeIdx, revisionQueue, wordStats, seenWords, fase2Fails, words]);

  // Cuando la cola de revisión queda vacía, avanzar
  useEffect(() => {
    if (screen === 'revision' && revisionQueue.length === 0) {
      afterBlockComplete();
    }
  }, [revisionQueue, screen]);

  function markStat(furigana, fails) {
    setWordStats(prev => {
      const cur = prev[furigana] || { errors: 0, copied: false };
      const next = { ...cur };
      if (fails >= 2) next.copied = true;
      next.errors = Math.max(next.errors, fails);
      return { ...prev, [furigana]: next };
    });
  }

  function startSession() {
    const parsed = parseInput(dbText);
    if (parsed.words.length === 0) return;
    const doseNum = wordDose === 'all' ? parsed.words.length : Number(wordDose);
    const shuffled = shuffle(parsed.words);
    const blocksArr = [];
    for (let i = 0; i < shuffled.length; i += doseNum) blocksArr.push(shuffled.slice(i, i + doseNum));
    setWords(parsed.words);
    setBlocks(blocksArr);
    setBlockIdx(0); setWordIdx(0); setStudyPhase(1);
    setChallengeQueue([]); setChallengeIdx(0);
    setRevisionQueue([]); setWordStats({}); setSeenWords([]); setFase2Fails([]);
    setScreen('study');
  }

  function resetAll() {
    clearAll();
    setDbText(""); setWordDose(10);
    setWords([]); setBlocks([]); setBlockIdx(0); setWordIdx(0); setStudyPhase(1);
    setChallengeQueue([]); setChallengeIdx(0); setRevisionQueue([]);
    setWordStats({}); setSeenWords([]); setFase2Fails([]);
    setScreen('config');
  }

  function exitSession() { clearSession(); setScreen('config'); }

  function nextStudyStep(fails) {
    if (studyPhase === 3 || studyPhase === 4) {
      const w = blocks[blockIdx][wordIdx];
      if (fails) markStat(w.furigana, fails);
    }
    if (studyPhase === 1) { setStudyPhase(2); return; }
    if (studyPhase === 3) { setStudyPhase(4); return; }
    const block = blocks[blockIdx];
    if (wordIdx + 1 < block.length) {
      setWordIdx(wi => wi + 1); setStudyPhase(1);
    } else {
      const newSeen = [...seenWords, ...block];
      setSeenWords(newSeen);
      const queue = buildChallengeQueue(block, newSeen);
      setChallengeQueue(queue); setChallengeIdx(0);
      setScreen('challenge');
    }
  }

  function onRecognitionResult(success) {
    const w = blocks[blockIdx][wordIdx];
    if (!success) {
      markStat(w.furigana, 1);
      setFase2Fails(prev => prev.some(x => x.furigana === w.furigana) ? prev : [...prev, w]);
    }
    setStudyPhase(3);
  }

  function onChallengeResult(success) {
    const q = challengeQueue[challengeIdx];
    if (!success) markStat(q.word.furigana, 1);
    if (challengeIdx + 1 < challengeQueue.length) {
      setChallengeIdx(i => i + 1);
    } else {
      if (fase2Fails.length > 0) {
        setRevisionQueue(shuffle(fase2Fails));
        setFase2Fails([]);
        setScreen('revision');
      } else {
        afterBlockComplete();
      }
    }
  }

  function onRevisionResult(word, success) {
    if (success) {
      setRevisionQueue(prev => prev.filter(w => w.furigana !== word.furigana));
    } else {
      markStat(word.furigana, 1);
      setRevisionQueue(prev => {
        const idx = prev.findIndex(w => w.furigana === word.furigana);
        if (idx === -1) return prev;
        const next = [...prev];
        const [item] = next.splice(idx, 1);
        next.push(item);
        return next;
      });
    }
  }

  function afterBlockComplete() {
    if (blockIdx + 1 < blocks.length) {
      setBlockIdx(bi => bi + 1); setWordIdx(0); setStudyPhase(1);
      setScreen('blockDone');
    } else {
      clearSession();
      setScreen('result');
    }
  }

  // ---- RENDER ----
  if (screen === 'config') {
    return <ConfigScreen dbText={dbText} setDbText={setDbText} wordDose={wordDose} setWordDose={setWordDose} onStart={startSession} onReset={resetAll} />;
  }

  if (screen === 'blockDone') {
    const justDone = blocks[blockIdx - 1] || [];
    return <BlockTransitionScreen block={justDone} blockDone={blockIdx} blockTotal={blocks.length} onContinue={() => setScreen('study')} />;
  }

  if (screen === 'result') {
    return <ResultScreen words={words} wordStats={wordStats} onNewSession={() => setScreen('config')} />;
  }

  if (screen === 'study') {
    const block = blocks[blockIdx] || [];
    const word = block[wordIdx];
    if (!word) return null;
    return (
      <div style={{ flex: 1, display: "flex", flexDirection: "column" }}>
        <TopBar onExit={exitSession} />
        <div style={{ padding: "12px 20px 0" }}>
          <ProgressBar current={wordIdx + 1} total={block.length} />
          <div style={{ fontSize: 10, color: C.textDim, marginTop: 4 }}>
            Bloque {blockIdx + 1}/{blocks.length} · Palabra {wordIdx + 1}/{block.length} · Fase {studyPhase}/4
          </div>
        </div>
        <div style={{ flex: 1, display: "flex", flexDirection: "column" }}>
          {studyPhase === 1 && <ExposicionEx key={`e-${blockIdx}-${wordIdx}`} word={word} onNext={() => nextStudyStep()} />}
          {studyPhase === 2 && <ReconocimientoEx key={`r-${blockIdx}-${wordIdx}`} word={word} blockWords={block} globalWords={words} onNext={onRecognitionResult} />}
          {studyPhase === 3 && <ConstruccionEx key={`c-${blockIdx}-${wordIdx}`} word={word} onNext={fails => nextStudyStep(fails)} />}
          {studyPhase === 4 && <EscrituraEx key={`w-${blockIdx}-${wordIdx}`} word={word} onNext={fails => nextStudyStep(fails)} />}
        </div>
      </div>
    );
  }

  if (screen === 'challenge') {
    const q = challengeQueue[challengeIdx];
    if (!q) return null;
    return (
      <div style={{ flex: 1, display: "flex", flexDirection: "column", background: C.challenge }}>
        <TopBar onExit={exitSession} title="🔥 Ronda Challenging" />
        <div style={{ padding: "12px 20px 0" }}>
          <ProgressBar current={challengeIdx + 1} total={challengeQueue.length} color={`linear-gradient(90deg, ${C.challengeDeep}, ${C.pink})`} />
          <div style={{ fontSize: 10, color: C.challengeText, marginTop: 4, fontWeight: 700 }}>
            {challengeIdx + 1}/{challengeQueue.length}
          </div>
        </div>
        <div style={{ flex: 1, display: "flex", flexDirection: "column" }}>
          <ChallengeEx key={`ch-${blockIdx}-${challengeIdx}`} question={q} onNext={onChallengeResult} />
        </div>
      </div>
    );
  }

  if (screen === 'revision') {
    const w = revisionQueue[0];
    if (!w) return null;
    return (
      <div style={{ flex: 1, display: "flex", flexDirection: "column" }}>
        <TopBar onExit={exitSession} title="Repaso" />
        <div style={{ padding: "12px 20px 0" }}>
          <div style={{ fontSize: 10, color: C.textDim, marginTop: 4 }}>Repasando reconocimiento · {revisionQueue.length} restante(s)</div>
        </div>
        <div style={{ flex: 1, display: "flex", flexDirection: "column" }}>
          <ReconocimientoEx key={`rev-${w.furigana}`} word={w} blockWords={blocks[blockIdx] || []} globalWords={words} onNext={success => onRevisionResult(w, success)} />
        </div>
      </div>
    );
  }

  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
