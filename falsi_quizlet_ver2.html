<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Falsi Quizlet v.2</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #f7f4ff; color: #111; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 16px; }

  #back-link { width: 100%; max-width: 600px; margin-bottom: 16px; }
  #back-link a { display: inline-flex; align-items: center; gap: 4px; color: #b07ddb; font-size: 0.9rem; text-decoration: none; font-weight: 500; }
  #back-link a:hover { text-decoration: underline; }

  h1 { font-size: 1.4rem; color: #7a4fa0; margin-bottom: 4px; letter-spacing: 1px; }
  .subtitle { font-size: 0.8rem; color: #888; margin-bottom: 24px; }

  /* SETUP */
  #setup { width: 100%; max-width: 600px; }
  textarea { width: 100%; height: 200px; background: #fff; border: 1px solid #ccc; border-radius: 10px; color: #111; padding: 14px; font-size: 0.9rem; resize: vertical; line-height: 1.6; }
  textarea::placeholder { color: #aaa; }
  .btn { background: #b07ddb; color: #fff; border: none; border-radius: 8px; padding: 12px 28px; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
  .btn:hover { background: #9a64c8; }
  .btn:disabled { background: #ccc; color: #888; cursor: default; }
  .error-msg { color: #dc2626; font-size: 0.85rem; margin-top: 8px; }

  /* TOGGLE BUTTONS (mode selector) */
  .toggle-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .toggle-btn { background: #f9f9fb; border: 1px solid #ddd; border-radius: 8px; padding: 8px 18px; font-size: 0.9rem; color: #555; cursor: pointer; transition: all 0.15s; }
  .toggle-btn:hover { border-color: #b07ddb; color: #b07ddb; }
  .toggle-btn.active { background: #ede0f7; border-color: #b07ddb; color: #7a4fa0; font-weight: 600; }

  /* SIZE BUTTONS */
  .size-btn { background: #f9f9fb; border: 1px solid #ddd; border-radius: 8px; padding: 8px 18px; font-size: 0.9rem; color: #555; cursor: pointer; transition: all 0.15s; }
  .size-btn:hover { border-color: #b07ddb; color: #b07ddb; }
  .size-btn.active { background: #ede0f7; border-color: #b07ddb; color: #7a4fa0; font-weight: 600; }

  .setup-section { margin-top: 18px; }
  .setup-section label { font-size: 0.85rem; color: #666; font-weight: 600; display: block; margin-bottom: 8px; }

  /* PROGRESS */
  #progress-bar-wrap { width: 100%; max-width: 600px; margin-bottom: 18px; display: none; }
  .progress-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; gap: 10px; }
  .phase-label { font-size: 0.75rem; color: #666; flex: 1; }
  .progress-actions { display: flex; gap: 12px; align-items: center; flex-shrink: 0; }
  .bar-bg { background: #ddd; border-radius: 99px; height: 6px; }
  .bar-fill { height: 6px; border-radius: 99px; background: #b07ddb; transition: width 0.3s; }

  /* CARD */
  #card { width: 100%; max-width: 600px; background: #fff; border-radius: 16px; padding: 22px 20px; display: none; box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
  .phase-badge { display: inline-block; font-size: 0.7rem; background: #ede0f7; color: #7a4fa0; border-radius: 99px; padding: 3px 12px; margin-bottom: 16px; letter-spacing: 1px; text-transform: uppercase; }
  .question-label { font-size: 0.75rem; color: #888; margin-bottom: 8px; }
  .question-text { font-size: clamp(1.5rem, 6vw, 2rem); font-weight: 700; color: #111; margin-bottom: 20px; letter-spacing: 2px; }

  /* CHOICES */
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 400px) { .choices { grid-template-columns: 1fr; } }
  .choice-btn { background: #f9f9fb; border: 1px solid #ddd; border-radius: 10px; padding: 14px 10px; font-size: 1.05rem; color: #111; cursor: pointer; transition: all 0.15s; text-align: center; line-height: 1.3; }
  .choice-btn:hover:not(:disabled) { border-color: #b07ddb; background: #ede0f7; }
  .choice-btn.correct { border-color: #16a34a; background: #f0fdf4; color: #15803d; }
  .choice-btn.wrong { border-color: #dc2626; background: #fef2f2; color: #dc2626; }
  .choice-btn:disabled { cursor: default; }

  /* WRITE */
  .write-input { width: 100%; background: #f9f9fb; border: 1px solid #ccc; border-radius: 10px; padding: 14px; font-size: 1.4rem; color: #111; text-align: center; outline: none; transition: border 0.2s; }
  .write-input:focus { border-color: #b07ddb; }
  .write-input.correct { border-color: #16a34a; background: #f0fdf4; }
  .write-input.wrong { border-color: #dc2626; background: #fef2f2; }
  .retry-prompt { margin-top: 10px; font-size: 0.85rem; color: #dc2626; display: none; }

  /* FEEDBACK */
  .feedback { margin-top: 16px; padding: 13px; border-radius: 10px; display: none; }
  .feedback.correct { background: #f0fdf4; border: 1px solid #86efac; }
  .feedback.wrong { background: #fef2f2; border: 1px solid #fca5a5; }
  .feedback-title { font-size: 0.8rem; font-weight: 700; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
  .feedback.correct .feedback-title { color: #15803d; }
  .feedback.wrong .feedback-title { color: #dc2626; }
  .feedback-correct-ans { font-size: 1rem; color: #7a4fa0; }

  /* POST-ANSWER OPTIONS (3-data mode only) */
  #post-answer { display: none; margin-top: 16px; }
  .post-label { font-size: 0.8rem; color: #888; margin-bottom: 10px; }
  .post-options { display: flex; flex-direction: column; gap: 8px; }
  .post-btn { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 12px 16px; font-size: 0.92rem; color: #333; cursor: pointer; text-align: left; transition: all 0.15s; display: flex; align-items: center; gap: 10px; }
  .post-btn:hover { border-color: #b07ddb; background: #f7f4ff; }
  .post-btn .post-icon { font-size: 1.1rem; flex-shrink: 0; }

  .meaning-reveal { margin-top: 10px; padding: 11px 14px; background: #f0e8f8; border: 1px solid #d4b8e8; border-radius: 10px; font-size: 0.95rem; color: #7a4fa0; display: none; }
  .meaning-label { font-size: 0.68rem; color: #b07ddb; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }

  #vocab-exercise { display: none; margin-top: 10px; }
  .vocab-ex-label { font-size: 0.75rem; color: #888; margin-bottom: 6px; }
  .vocab-ex-q { font-size: 1rem; font-weight: 600; color: #111; margin-bottom: 12px; line-height: 1.4; }
  .vocab-feedback { margin-top: 10px; padding: 11px 13px; border-radius: 10px; display: none; font-size: 0.9rem; }
  .vocab-feedback.correct { background: #f0fdf4; border: 1px solid #86efac; color: #15803d; }
  .vocab-feedback.wrong { background: #fef2f2; border: 1px solid #fca5a5; color: #dc2626; }

  /* NEXT */
  .next-btn { margin-top: 14px; width: 100%; background: #b07ddb; color: #fff; border: none; border-radius: 8px; padding: 14px; font-size: 1rem; cursor: pointer; display: none; transition: background 0.2s; }
  .next-btn:hover { background: #9a64c8; }

  /* BETWEEN PHASES */
  #phase-transition { width: 100%; max-width: 600px; background: #fff; border-radius: 16px; padding: 32px; display: none; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
  #phase-transition h2 { color: #7a4fa0; margin-bottom: 10px; }
  #phase-transition p { color: #555; font-size: 0.9rem; margin-bottom: 20px; }

  /* RESULTS */
  #results { width: 100%; max-width: 600px; display: none; }
  .results-title { font-size: 1.3rem; color: #7a4fa0; margin-bottom: 6px; }
  .results-stats { font-size: 0.9rem; color: #666; margin-bottom: 20px; }
  .no-mistakes { color: #15803d; font-size: 1rem; padding: 20px 0; text-align: center; }
  .restart-btn { margin-top: 20px; width: 100%; }

  .results-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.07); font-size: 0.88rem; }
  .results-table thead tr { background: #ede0f7; }
  .results-table th { padding: 11px 12px; text-align: left; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: #7a4fa0; font-weight: 700; }
  .results-table td { padding: 11px 12px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
  .results-table tbody tr:last-child td { border-bottom: none; }
  .results-table tbody tr:hover { background: #fafafa; }
  .td-a { font-size: 1.1rem; font-weight: 700; letter-spacing: 1px; }
  .td-c { color: #555; }
  .tag-phase { background: #ede0f7; color: #7a4fa0; border-radius: 99px; padding: 2px 9px; font-size: 0.73rem; white-space: nowrap; }

  .results-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
  .btn-copy-results { background: #fff; color: #7a4fa0; border: 1.5px solid #b07ddb; border-radius: 8px; padding: 12px 28px; font-size: 1rem; cursor: pointer; transition: all 0.2s; width: 100%; margin-bottom: 14px; }
  .btn-copy-results:hover { background: #ede0f7; }
  .summary-detail { font-size: 0.78rem; color: #666; line-height: 1.35; }
  .status-tag { display: inline-block; border-radius: 99px; padding: 3px 9px; font-size: 0.73rem; white-space: nowrap; font-weight: 600; }
  .status-mastered { background: #f0fdf4; color: #15803d; }
  .status-reviewed { background: #eff6ff; color: #2563eb; }
  .status-recognition { background: #fff7ed; color: #c2410c; }
  .status-weak { background: #fef2f2; color: #dc2626; }
  .btn-repeat-errors { background: #dc2626; color: #fff; border: none; border-radius: 8px; padding: 12px 28px; font-size: 1rem; cursor: pointer; transition: background 0.2s; width: 100%; }
  .btn-repeat-errors:hover { background: #b91c1c; }
  .btn-repeat-group { background: #fff; color: #7a4fa0; border: 1.5px solid #b07ddb; border-radius: 8px; padding: 12px 28px; font-size: 1rem; cursor: pointer; transition: all 0.2s; width: 100%; }
  .btn-repeat-group:hover { background: #ede0f7; }
</style>
</head>
<body>

<div id="back-link">
  <a href="https://kekitopan13.github.io/estudio-jp/">← メニュー</a>
</div>

<h1>Study Tool</h1>
<p class="subtitle">Herramienta de estudio flexible</p>

<!-- SETUP -->
<div id="setup">

  <!-- STEP 1: MODE -->
  <div class="setup-section">
    <label>1. ¿Cuántos datos tiene tu vocabulario?</label>
    <div class="toggle-group">
      <button class="toggle-btn active" id="mode-btn-2" onclick="selectMode('2')">2 datos (A · B)</button>
      <button class="toggle-btn" id="mode-btn-3" onclick="selectMode('3')">3 datos (A · B · C)</button>
    </div>
  </div>

  <!-- STEP 2: TEXTAREA -->
  <div class="setup-section">
    <label id="input-label">2. Pega tu vocabulario (formato: <strong style="color:#7a4fa0">Dato A;Dato B</strong>, una entrada por línea)</label>
    <textarea id="vocab-input" placeholder="ならぶ;hacer fila&#10;ならべる;ordenar en fila&#10;たにん;desconocido"></textarea>
    <div id="input-error" class="error-msg"></div>
  </div>

  <!-- STEP 2b: COLUMN MAPPING — visible solo en modo 3 datos -->
  <div class="setup-section" id="col-mapping-section" style="display:none">
    <label>2b. ¿Qué representa cada columna?</label>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:4px;">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <span style="font-size:0.85rem;color:#555;min-width:80px;">Col. 1 es el…</span>
        <div class="toggle-group" style="margin-top:0">
          <button class="toggle-btn active" id="c1-btn-a" onclick="setCol(1,'a')">Dato A</button>
          <button class="toggle-btn" id="c1-btn-b" onclick="setCol(1,'b')">Dato B</button>
          <button class="toggle-btn" id="c1-btn-c" onclick="setCol(1,'c')">Dato C</button>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <span style="font-size:0.85rem;color:#555;min-width:80px;">Col. 2 es el…</span>
        <div class="toggle-group" style="margin-top:0">
          <button class="toggle-btn" id="c2-btn-a" onclick="setCol(2,'a')">Dato A</button>
          <button class="toggle-btn active" id="c2-btn-b" onclick="setCol(2,'b')">Dato B</button>
          <button class="toggle-btn" id="c2-btn-c" onclick="setCol(2,'c')">Dato C</button>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <span style="font-size:0.85rem;color:#555;min-width:80px;">Col. 3 es el…</span>
        <div class="toggle-group" style="margin-top:0">
          <button class="toggle-btn" id="c3-btn-a" onclick="setCol(3,'a')">Dato A</button>
          <button class="toggle-btn" id="c3-btn-b" onclick="setCol(3,'b')">Dato B</button>
          <button class="toggle-btn active" id="c3-btn-c" onclick="setCol(3,'c')">Dato C</button>
        </div>
      </div>
    </div>
    <div id="col-map-error" class="error-msg" style="margin-top:8px;"></div>
  </div>

  <!-- STEP 3: DIRECTION (alternativas) -->
  <div class="setup-section">
    <label>3. Dirección — Alternativas</label>
    <div class="toggle-group">
      <button class="toggle-btn active" id="dir-btn-b" onclick="selectDir('b')">Mostrar A → responder B</button>
      <button class="toggle-btn" id="dir-btn-a" onclick="selectDir('a')">Mostrar B → responder A</button>
      <button class="toggle-btn" id="dir-btn-both" onclick="selectDir('both')">Ambas direcciones</button>
    </div>
  </div>

  <!-- STEP 4: PRACTICE TYPE -->
  <div class="setup-section">
    <label>4. Tipo de práctica</label>
    <div class="toggle-group">
      <button class="toggle-btn active" id="ptype-btn-mc" onclick="selectPType('mc')">Solo alternativas</button>
      <button class="toggle-btn" id="ptype-btn-both" onclick="selectPType('mc+write')">Alternativas + escritura</button>
    </div>
  </div>

  <!-- STEP 4b: DIRECTION (escritura) — visible solo en mc+write -->
  <div class="setup-section" id="write-dir-section" style="display:none">
    <label>4b. Dirección — Escritura</label>
    <div class="toggle-group">
      <button class="toggle-btn active" id="wdir-btn-b" onclick="selectWriteDir('b')">Mostrar A → escribir B</button>
      <button class="toggle-btn" id="wdir-btn-a" onclick="selectWriteDir('a')">Mostrar B → escribir A</button>
      <button class="toggle-btn" id="wdir-btn-both" onclick="selectWriteDir('both')">Ambas direcciones</button>
    </div>
  </div>

  <!-- STEP 5: GROUP SIZE -->
  <div class="setup-section">
    <label>5. Tamaño del grupo</label>
    <div class="toggle-group">
      <button class="size-btn active" data-val="5" onclick="selectSize(this)">5</button>
      <button class="size-btn" data-val="10" onclick="selectSize(this)">10</button>
      <button class="size-btn" data-val="15" onclick="selectSize(this)">15</button>
      <button class="size-btn" data-val="20" onclick="selectSize(this)">20</button>
    </div>
  </div>

  <div class="setup-section">
    <button class="btn" onclick="startStudy()">Comenzar estudio</button>
  </div>
</div>

<!-- PROGRESS -->
<div id="progress-bar-wrap">
  <div class="progress-top">
    <div class="phase-label" id="phase-label"></div>
    <div class="progress-actions">
      <button onclick="goToSetup()" style="font-size:0.8rem;color:#b07ddb;font-weight:500;background:none;border:none;cursor:pointer;padding:0;white-space:nowrap;">← Inicio</button>
      <button onclick="finishEarly()" style="font-size:0.8rem;color:#888;font-weight:500;background:none;border:none;cursor:pointer;padding:0;white-space:nowrap;">Terminar sesión</button>
    </div>
  </div>
  <div class="bar-bg"><div class="bar-fill" id="bar-fill" style="width:0%"></div></div>
</div>

<!-- CARD -->
<div id="card">
  <div class="phase-badge" id="phase-badge"></div>
  <div class="question-label" id="q-label"></div>
  <div class="question-text" id="q-text"></div>

  <div id="choices-wrap" class="choices"></div>

  <div id="write-wrap" style="display:none">
    <input type="text" class="write-input" id="write-input" placeholder="Escribe la respuesta..." autocomplete="off" autocorrect="off" spellcheck="false">
    <p class="retry-prompt" id="retry-prompt">✗ Incorrecto. Intenta de nuevo:</p>
    <button class="btn" id="submit-write-btn" style="margin-top:12px;width:100%" onclick="checkWrite()">Confirmar</button>
  </div>

  <div class="feedback" id="feedback">
    <div class="feedback-title" id="feedback-title"></div>
    <div class="feedback-correct-ans" id="feedback-correct-ans"></div>
  </div>

  <!-- Post-answer options (only in 3-data mode) -->
  <div id="post-answer">
    <p class="post-label">¿Qué quieres hacer ahora?</p>
    <div class="post-options">
      <button class="post-btn" id="post-btn-meaning" onclick="postAction('meaning')">
        <span class="post-icon">📖</span> Ver el dato C de esta entrada
      </button>
      <button class="post-btn" id="post-btn-vocab" onclick="postAction('vocab')">
        <span class="post-icon">🧩</span> Ejercitar el dato C en alternativas
      </button>
      <button class="post-btn" onclick="postAction('next')">
        <span class="post-icon">➡️</span> Seguir
      </button>
    </div>

    <div class="meaning-reveal" id="meaning-reveal">
      <div class="meaning-label">Dato C</div>
      <div id="meaning-reveal-text"></div>
    </div>

    <div id="vocab-exercise">
      <div class="vocab-ex-label" style="margin-top:14px;">Escoge el dato C que corresponde a:</div>
      <div class="vocab-ex-q" id="vocab-ex-q"></div>
      <div class="choices" id="vocab-choices" style="grid-template-columns:1fr;"></div>
      <div class="vocab-feedback" id="vocab-feedback"></div>
    </div>
  </div>

  <button class="next-btn" id="next-btn" onclick="nextQuestion()">Siguiente →</button>
</div>

<!-- PHASE TRANSITION -->
<div id="phase-transition">
  <h2 id="pt-title"></h2>
  <p id="pt-desc"></p>
  <button class="btn" onclick="startNextSubPhase()">Continuar →</button>
</div>

<!-- RESULTS -->
<div id="results">
  <div class="results-title">📊 Resultados finales</div>
  <div class="results-stats" id="results-stats"></div>
  <button class="btn-copy-results" id="btn-copy-results" onclick="copyResults()">📋 Copiar resumen</button>
  <div id="mistakes-list"></div>
  <div class="results-actions">
    <button class="btn-repeat-errors" id="btn-repeat-errors" onclick="repeatErrors()" style="display:none">🔁 Repetir errores</button>
    <button class="btn-repeat-group" id="btn-repeat-group" onclick="repeatLastGroup()">🔁 Repetir este grupo</button>
    <button class="btn restart-btn" onclick="goToSetup()">Volver a empezar</button>
  </div>
</div>

<script>
// ─── STUDY MODEL ──────────────────────────────────────────────────────────────
// Configuration stays separate from the words and the progress of one session.
// The phase names include the future review phases, but this version still uses
// only multiple choice and writing exactly as before.
const PHASES = Object.freeze({
  MULTIPLE_CHOICE: 'mc',
  WRITING: 'write',
  REVIEW_WRITING: 'reviewWriting',
  REVIEW_CHOICE: 'reviewChoice'
});

const config = {
  groupSize: 5,
  dataMode: '2',
  exerciseDir: 'b',
  writeDir: 'b',
  practiceType: 'mc',
  colMapping: ['a', 'b', 'c']
};

const study = {
  words: [],
  groups: []
};

function createSession() {
  return {
    groupIndex: 0,
    phase: PHASES.MULTIPLE_CHOICE,
    queue: [],
    currentQuestion: null,
    totalQuestions: 0,
    completedQuestions: 0,
    writeAttempts: 0,
    vocabExerciseDone: false,
    lastGroupIndex: 0,
    reviewWords: [],
    reviewBlockStartIndex: 0,
    nextPhaseCallback: null
  };
}

let session = createSession();

function prepareWords(words) {
  return words.map((word, index) => ({
    ...word,
    id: `word-${index}`,
    state: {
      initialChoice: null,
      initialWrite: null,
      reviewWrite: null,
      reviewChoice: null
    }
  }));
}

const configFields = {
  GROUP_SIZE: 'groupSize', dataMode: 'dataMode', exerciseDir: 'exerciseDir',
  writeDir: 'writeDir', practiceType: 'practiceType', colMapping: 'colMapping'
};

Object.entries(configFields).forEach(([name, field]) => {
  Object.defineProperty(globalThis, name, {
    get: () => config[field],
    set: value => { config[field] = value; },
    configurable: true
  });
});

// Compatibility bridge: the existing answer and results helpers continue to use
// concise names, while all mutable runtime data now lives in `study` or `session`.
const runtimeFields = {
  vocab: ['study', 'words'], allGroups: ['study', 'groups'],
  groupIdx: ['session', 'groupIndex'], subPhase: ['session', 'phase'],
  queue: ['session', 'queue'], current: ['session', 'currentQuestion'],
  totalQ: ['session', 'totalQuestions'],
  doneQ: ['session', 'completedQuestions'], writeAttempts: ['session', 'writeAttempts'],
  vocabExDone: ['session', 'vocabExerciseDone'], lastGroupIdx: ['session', 'lastGroupIndex']
};

Object.entries(runtimeFields).forEach(([name, [owner, field]]) => {
  Object.defineProperty(globalThis, name, {
    get: () => owner === 'study' ? study[field] : session[field],
    set: value => { (owner === 'study' ? study : session)[field] = value; },
    configurable: true
  });
});

// ─── SETUP SELECTORS ─────────────────────────────────────────────────────────

function selectMode(val) {
  dataMode = val;
  document.getElementById('mode-btn-2').classList.toggle('active', val === '2');
  document.getElementById('mode-btn-3').classList.toggle('active', val === '3');
  document.getElementById('col-mapping-section').style.display = val === '3' ? 'block' : 'none';
  const lbl = document.getElementById('input-label');
  if (val === '2') {
    lbl.innerHTML = '2. Pega tu vocabulario (formato: <strong style="color:#7a4fa0">Dato A;Dato B</strong>, una entrada por línea)';
    document.getElementById('vocab-input').placeholder = 'ならぶ;hacer fila\nならべる;ordenar en fila\nたにん;desconocido';
  } else {
    lbl.innerHTML = '2. Pega tu vocabulario (formato: <strong style="color:#7a4fa0">Col.1;Col.2;Col.3</strong>, una entrada por línea)';
    document.getElementById('vocab-input').placeholder = '並ぶ;ならぶ;algo o alguien hace fila\n並べる;ならべる;ordenar algo en fila\n他人;たにん;desconocido, otra persona';
  }
}

// setCol(colNum 1|2|3, role 'a'|'b'|'c')
function setCol(colNum, role) {
  colMapping[colNum - 1] = role;
  // Actualizar botones de esa fila
  ['a','b','c'].forEach(r => {
    document.getElementById(`c${colNum}-btn-${r}`).classList.toggle('active', r === role);
  });
  document.getElementById('col-map-error').textContent = '';
}

function validateColMapping() {
  const roles = colMapping;
  if (new Set(roles).size < 3) {
    document.getElementById('col-map-error').textContent =
      'Cada columna debe tener un rol distinto (A, B y C sin repetir).';
    return false;
  }
  return true;
}

function selectDir(val) {
  exerciseDir = val;
  ['a','b','both'].forEach(d => {
    document.getElementById('dir-btn-'+d).classList.toggle('active', val === d);
  });
}

function selectWriteDir(val) {
  writeDir = val;
  ['a','b','both'].forEach(d => {
    document.getElementById('wdir-btn-'+d).classList.toggle('active', val === d);
  });
}

function selectPType(val) {
  practiceType = val;
  document.getElementById('ptype-btn-mc').classList.toggle('active', val === 'mc');
  document.getElementById('ptype-btn-both').classList.toggle('active', val === 'mc+write');
  document.getElementById('write-dir-section').style.display = val === 'mc+write' ? 'block' : 'none';
}

function selectSize(btn) {
  document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  GROUP_SIZE = parseInt(btn.dataset.val);
}

// ─── PARSE ────────────────────────────────────────────────────────────────────

function parseVocab(text) {
  const lines = text.trim().split('\n').filter(l => l.trim());
  const result = [];
  const minCols = dataMode === '3' ? 3 : 2;
  for (const line of lines) {
    const parts = line.split(';');
    if (parts.length < minCols) return null;
    let entry;
    if (dataMode === '3') {
      // colMapping[i] dice qué rol tiene la columna i
      entry = {};
      colMapping.forEach((role, i) => { entry[role] = parts[i].trim(); });
    } else {
      entry = { a: parts[0].trim(), b: parts[1].trim() };
    }
    result.push(entry);
  }
  return result.length >= 2 ? result : null;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ─── NAVIGATION ───────────────────────────────────────────────────────────────

function goToSetup() {
  session = createSession();
  hide('results'); hide('card'); hide('progress-bar-wrap'); hide('phase-transition');
  show('setup');
}

function finishEarly() { showResults(); }

// ─── BUILD QUEUE ─────────────────────────────────────────────────────────────
// Each queue item: { word, direction: 'ab' | 'ba' }
// 'ab' = show A, answer B
// 'ba' = show B, answer A

function buildQueueItems(group, dir) {
  const items = [];
  if (dir === 'b') {
    group.forEach(w => items.push({ word: w, direction: 'ab' }));
  } else if (dir === 'a') {
    group.forEach(w => items.push({ word: w, direction: 'ba' }));
  } else { // 'both'
    group.forEach(w => {
      items.push({ word: w, direction: 'ab' });
      items.push({ word: w, direction: 'ba' });
    });
  }
  return shuffle(items);
}

function isReviewPhase(phase = session.phase) {
  return phase === PHASES.REVIEW_WRITING || phase === PHASES.REVIEW_CHOICE;
}

function isWritingPhase(phase = session.phase) {
  return phase === PHASES.WRITING || phase === PHASES.REVIEW_WRITING;
}

function getPhaseWords() {
  return isReviewPhase() ? session.reviewWords : study.groups[session.groupIndex];
}

function getPhaseDirection() {
  return isWritingPhase() ? config.writeDir : config.exerciseDir;
}

function getPhaseLabel() {
  const activity = isWritingPhase() ? 'Escritura' : 'Alternativas';
  return isReviewPhase() ? `Repaso · ${activity}` : activity;
}

function buildPhaseQueue() {
  let words = getPhaseWords();
  if (session.phase === PHASES.REVIEW_WRITING) {
    words = words.filter(word => word.state.initialWrite === false);
  } else if (session.phase === PHASES.REVIEW_CHOICE) {
    words = words.filter(word => word.state.reviewWrite === false);
  }
  return buildQueueItems(words, getPhaseDirection());
}

function shouldStartReview() {
  const groupsSinceLastReview = session.groupIndex - session.reviewBlockStartIndex;
  return config.practiceType === 'mc+write' &&
    (groupsSinceLastReview === 3 || session.groupIndex === study.groups.length);
}

function prepareReviewBlock() {
  session.reviewWords = study.groups
    .slice(session.reviewBlockStartIndex, session.groupIndex)
    .flat();
  session.reviewBlockStartIndex = session.groupIndex;
}

// ─── START ────────────────────────────────────────────────────────────────────

function startStudy() {
  if (dataMode === '3' && !validateColMapping()) return;
  const text = document.getElementById('vocab-input').value;
  const parsed = parseVocab(text);
  if (!parsed) {
    const cols = dataMode === '3' ? '3 columnas' : '2 columnas';
    document.getElementById('input-error').textContent =
      `Error: necesitas al menos 2 entradas con ${cols} separadas por punto y coma (;).`;
    return;
  }
  document.getElementById('input-error').textContent = '';
  study.words = shuffle(prepareWords(parsed));
  study.groups = [];
  for (let i = 0; i < study.words.length; i += config.groupSize) {
    study.groups.push(study.words.slice(i, i + config.groupSize));
  }
  session = createSession();
  hide('setup'); show('progress-bar-wrap'); show('card');
  loadSubPhase();
}

// ─── PHASE MANAGEMENT ─────────────────────────────────────────────────────────

function loadSubPhase() {
  session.queue = buildPhaseQueue();
  session.totalQuestions = session.queue.length;
  session.completedQuestions = 0;
  session.writeAttempts = 0;
  updateProgress();
  advanceQuestion();
}

function updateProgress() {
  const phaseLabel = getPhaseLabel();
  const groupLabel = isReviewPhase()
    ? `Repaso ${Math.ceil(session.groupIndex / 3)}`
    : `Grupo ${groupIdx + 1}/${allGroups.length}`;
  document.getElementById('phase-label').textContent =
    `${groupLabel} · ${phaseLabel} — ${doneQ}/${totalQ}`;
  document.getElementById('bar-fill').style.width = totalQ ? (doneQ / totalQ * 100) + '%' : '0%';
}

// ─── SHOW QUESTION ────────────────────────────────────────────────────────────

function advanceQuestion() {
  if (queue.length === 0) {
    handleCompletedPhase();
    return;
  }

  session.currentQuestion = session.queue.shift();
  session.writeAttempts = 0;
  session.vocabExerciseDone = false;
  renderCurrentQuestion();
}

function handleCompletedPhase() {
  if (session.phase === PHASES.MULTIPLE_CHOICE && config.practiceType === 'mc+write') {
      showTransition(
        `¡Bien! Ahora a escribir`,
        `Escribirás las mismas ${buildQueueItems(study.groups[session.groupIndex], config.writeDir).length} entradas del grupo ${session.groupIndex + 1}.`,
        () => { session.phase = PHASES.WRITING; loadSubPhase(); }
      );
    return;
  }

  if (session.phase === PHASES.REVIEW_WRITING) {
    session.phase = PHASES.REVIEW_CHOICE;
    loadSubPhase();
    return;
  }

  if (session.phase === PHASES.REVIEW_CHOICE) {
    finishReviewBlock();
    return;
  }

  session.groupIndex++;
  if (shouldStartReview()) {
    prepareReviewBlock();
    session.phase = PHASES.REVIEW_WRITING;
    showTransition(
      'Hora de repasar',
      'Primero practicarás por escritura las entradas que fallaste.',
      () => loadSubPhase()
    );
    return;
  }

  continueToNextGroup();
}

function finishReviewBlock() {
  if (session.groupIndex >= study.groups.length) {
    session.lastGroupIndex = session.groupIndex - 1;
    showResults();
    return;
  }

  showTransition(
    'Repaso completado ✓',
    `Pasando al grupo ${session.groupIndex + 1} de ${study.groups.length} (${study.groups[session.groupIndex].length} entradas).`,
    () => { session.phase = PHASES.MULTIPLE_CHOICE; loadSubPhase(); }
  );
}

function continueToNextGroup() {
  if (session.groupIndex >= study.groups.length) {
    session.lastGroupIndex = session.groupIndex - 1;
    showResults();
  } else {
    session.lastGroupIndex = session.groupIndex - 1;
    showTransition(
      `Grupo ${session.groupIndex} completado ✓`,
      `Pasando al grupo ${session.groupIndex + 1} de ${study.groups.length} (${study.groups[session.groupIndex].length} entradas).`,
      () => { session.phase = PHASES.MULTIPLE_CHOICE; loadSubPhase(); }
    );
  }
}

function showQuestion() { advanceQuestion(); }

function renderCurrentQuestion() {
  hide('phase-transition'); show('card');
  hide('feedback'); hide('post-answer'); hide('meaning-reveal');
  hide('vocab-exercise'); hide('next-btn'); hide('retry-prompt');
  document.querySelectorAll('.post-btn').forEach(b => b.disabled = false);

  const { word, direction } = current;
  // direction 'ab' = show A, answer B; 'ba' = show B, answer A
  const shown  = direction === 'ab' ? word.a : word.b;
  const answer = direction === 'ab' ? word.b : word.a;

  const badge = document.getElementById('phase-badge');
  badge.textContent = isReviewPhase()
    ? getPhaseLabel()
    : `Grupo ${groupIdx + 1} · ${getPhaseLabel()}`;
  document.getElementById('q-label').textContent =
    direction === 'ab' ? 'Escoge o escribe el Dato B:' : 'Escoge o escribe el Dato A:';
  document.getElementById('q-text').textContent = shown;

  const choicesWrap = document.getElementById('choices-wrap');

  if (!isWritingPhase()) {
    show('choices-wrap'); hide('write-wrap');
    choicesWrap.style.display = 'grid';
    const choices = buildChoices(word, direction);
    choicesWrap.innerHTML = '';
    choices.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = c.text;
      btn.onclick = () => selectChoice(btn, c.correct, word, direction);
      choicesWrap.appendChild(btn);
    });
  } else {
    hide('choices-wrap'); show('write-wrap');
    const inp = document.getElementById('write-input');
    inp.value = ''; inp.className = 'write-input'; inp.disabled = false;
    document.getElementById('submit-write-btn').disabled = false;
    inp.placeholder = `Escribe el Dato ${direction === 'ab' ? 'B' : 'A'}...`;
    inp.focus();
  }

  // Post-answer: only show extra options in 3-data mode
  // (buttons are revealed later in showPostAnswer)
}

// ─── MC PHASE ─────────────────────────────────────────────────────────────────

function buildChoices(word, direction) {
  const correct = direction === 'ab' ? word.b : word.a;
  const pool = vocab.filter(w => w !== word);
  const scored = pool.map(w => {
    const cand = direction === 'ab' ? w.b : w.a;
    return { text: cand, score: similarity(correct, cand) };
  }).sort((a, b) => b.score - a.score);
  const distractors = [];
  const seen = new Set([correct]);
  for (const s of scored) {
    if (!seen.has(s.text)) { seen.add(s.text); distractors.push({ text: s.text, correct: false }); }
    if (distractors.length >= 3) break;
  }
  return shuffle([{ text: correct, correct: true }, ...distractors]);
}

function similarity(a, b) {
  let shared = 0;
  const bc = b.split('');
  for (const ch of a) { const i = bc.indexOf(ch); if (i !== -1) { shared++; bc.splice(i, 1); } }
  return shared / Math.max(a.length, b.length);
}

function selectChoice(btn, isCorrect, word, direction) {
  doneQ++;
  const stateField = session.phase === PHASES.REVIEW_CHOICE ? 'reviewChoice' : 'initialChoice';
  if (!isCorrect || word.state[stateField] === null) word.state[stateField] = isCorrect;
  const allBtns = document.querySelectorAll('#choices-wrap .choice-btn');
  allBtns.forEach(b => b.disabled = true);
  const correctAnswer = direction === 'ab' ? word.b : word.a;
  btn.classList.add(isCorrect ? 'correct' : 'wrong');
  if (!isCorrect) {
    allBtns.forEach(b => { if (b.textContent === correctAnswer) b.classList.add('correct'); });
  }
  showFeedback(isCorrect, correctAnswer);
  updateProgress();
  showPostAnswer();
}

// ─── WRITE PHASE ──────────────────────────────────────────────────────────────

function checkWrite() {
  const inp = document.getElementById('write-input');
  const val = inp.value.trim();
  const { word, direction } = current;
  const correct = direction === 'ab' ? word.b : word.a;
  const stateField = session.phase === PHASES.REVIEW_WRITING ? 'reviewWrite' : 'initialWrite';
  if (val === correct) {
    inp.className = 'write-input correct';
    inp.disabled = true;
    document.getElementById('submit-write-btn').disabled = true;
    hide('retry-prompt');
    if (writeAttempts === 0) {
      doneQ++;
      if (word.state[stateField] === null) word.state[stateField] = true;
    }
    showFeedback(true, correct);
    updateProgress();
    showPostAnswer();
  } else {
    inp.className = 'write-input wrong';
    if (writeAttempts === 0) {
      word.state[stateField] = false;
    }
    writeAttempts++;
    show('retry-prompt');
    showFeedback(false, correct);
    setTimeout(() => {
      inp.value = ''; inp.className = 'write-input';
      hide('feedback'); hide('retry-prompt'); inp.focus();
    }, 1800);
  }
}

document.getElementById('write-input').addEventListener('keydown', e => { if (e.key === 'Enter') checkWrite(); });

// ─── POST-ANSWER ──────────────────────────────────────────────────────────────

function showPostAnswer() {
  if (dataMode === '3') {
    // Show full post-answer panel with dato C options
    show('post-answer');
    hide('meaning-reveal');
    hide('vocab-exercise');
    hide('next-btn');
    document.getElementById('vocab-feedback').style.display = 'none';
    document.querySelectorAll('.post-btn').forEach(b => b.disabled = false);
  } else {
    // 2-data mode: just show Next button
    show('next-btn');
  }
}

function postAction(action) {
  document.querySelectorAll('.post-btn').forEach(b => b.disabled = true);
  if (action === 'meaning') {
    document.getElementById('meaning-reveal-text').textContent = current.word.c || '—';
    show('meaning-reveal');
    show('next-btn');
  } else if (action === 'vocab') {
    showVocabExercise();
  } else {
    nextQuestion();
  }
}

// ─── VOCAB EXERCISE (dato C) ──────────────────────────────────────────────────

function showVocabExercise() {
  show('vocab-exercise');
  document.getElementById('vocab-feedback').style.display = 'none';
  document.getElementById('vocab-ex-q').textContent = current.word.a + '　(' + current.word.b + ')';
  document.querySelector('.vocab-ex-label').textContent = '¿Cuál es el Dato C de esta entrada?';
  const correct = current.word.c;
  const pool = vocab.filter(w => w.a !== current.word.a);
  const distractors = shuffle(pool).slice(0, 3).map(w => ({ text: w.c, correct: false }));
  const choices = shuffle([{ text: correct, correct: true }, ...distractors]);
  const wrap = document.getElementById('vocab-choices');
  wrap.innerHTML = '';
  choices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c.text;
    btn.style.fontSize = '0.88rem';
    btn.style.textAlign = 'left';
    btn.style.padding = '12px';
    btn.onclick = () => checkVocabChoice(btn, c.correct, correct, wrap);
    wrap.appendChild(btn);
  });
}

function checkVocabChoice(btn, isCorrect, correctAns, wrap) {
  if (vocabExDone) return;
  vocabExDone = true;
  [...wrap.querySelectorAll('.choice-btn')].forEach(b => {
    b.disabled = true;
    if (b.textContent === correctAns) b.classList.add('correct');
  });
  if (!isCorrect) btn.classList.add('wrong');
  const fb = document.getElementById('vocab-feedback');
  fb.className = 'vocab-feedback ' + (isCorrect ? 'correct' : 'wrong');
  fb.textContent = isCorrect ? `✓ Correcto: ${correctAns}` : `✗ Incorrecto. La respuesta era: ${correctAns}`;
  fb.style.display = 'block';
  show('next-btn');
}

// ─── SHARED ───────────────────────────────────────────────────────────────────

function showFeedback(isCorrect, correctAns) {
  const fb = document.getElementById('feedback');
  fb.className = 'feedback ' + (isCorrect ? 'correct' : 'wrong');
  document.getElementById('feedback-title').textContent = isCorrect ? '✓ Correcto' : '✗ Incorrecto';
  document.getElementById('feedback-correct-ans').textContent = isCorrect ? `Respuesta: ${correctAns}` : `Respuesta correcta: ${correctAns}`;
  show('feedback');
}

function nextQuestion() { showQuestion(); }

function showTransition(title, desc, callback) {
  hide('card');
  show('phase-transition');
  document.getElementById('pt-title').textContent = title;
  document.getElementById('pt-desc').textContent = desc;
  session.nextPhaseCallback = callback;
}

function startNextSubPhase() {
  hide('phase-transition');
  if (session.nextPhaseCallback) session.nextPhaseCallback();
}

function wordNeedsMorePractice(word) {
  if (config.practiceType !== 'mc+write') return word.state.initialChoice === false;
  // A word only remains pending when it was still missed in review writing.
  // The later summary will show whether it was at least recognized in choices.
  return word.state.initialWrite === false && word.state.reviewWrite === false;
}

function getWordStatus(word) {
  if (config.practiceType !== 'mc+write') {
    return word.state.initialChoice === false
      ? { key: 'weak', label: 'Necesita refuerzo', detail: '✗ Alternativas iniciales' }
      : { key: 'mastered', label: 'Dominada', detail: '✓ Alternativas iniciales' };
  }

  if (word.state.initialWrite === true) {
    return { key: 'mastered', label: 'Dominada', detail: '✓ Escritura inicial' };
  }
  if (word.state.reviewWrite === true) {
    return { key: 'reviewed', label: 'Corregida en repaso', detail: '✓ Escritura de repaso' };
  }
  if (word.state.reviewChoice === true) {
    return { key: 'recognition', label: 'Solo reconocimiento', detail: '✓ Alternativas de repaso · falta escritura' };
  }
  return { key: 'weak', label: 'Necesita refuerzo', detail: '✗ Escritura y alternativas de repaso' };
}

function getSummaryRows() {
  const collator = new Intl.Collator('ja');
  return study.words
    .map(word => ({ ...word, status: getWordStatus(word) }))
    .sort((left, right) => collator.compare(left.a, right.a));
}

function getFinalResultRows() {
  return study.words
    .filter(wordNeedsMorePractice)
    .map(word => ({
      a: word.a,
      b: word.b,
      c: word.c || null,
      direction: word.state.reviewChoice === false ? 'reviewChoice' : 'reviewWriting',
      phase: config.practiceType === 'mc+write' ? 'Repaso' : 'Alternativas'
    }));
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>'"]/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
  })[char]);
}

function copyResults() {
  const rows = getSummaryRows();
  const hasCol = config.dataMode === '3';
  const header = ['Dato A', 'Dato B', ...(hasCol ? ['Dato C'] : []), 'Estado', 'Detalle'];
  const lines = rows.map(row => [
    row.a, row.b, ...(hasCol ? [row.c || '—'] : []), row.status.label, row.status.detail
  ].join('\t'));
  const text = [header.join('\t'), ...lines].join('\n');
  const button = document.getElementById('btn-copy-results');
  const copied = () => {
    button.textContent = '✓ Resumen copiado';
    setTimeout(() => { button.textContent = '📋 Copiar resumen'; }, 2000);
  };

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(copied).catch(() => fallbackCopy(text, copied));
  } else {
    fallbackCopy(text, copied);
  }
}

function fallbackCopy(text, onCopied) {
  const area = document.createElement('textarea');
  area.value = text;
  area.style.position = 'fixed';
  area.style.opacity = '0';
  document.body.appendChild(area);
  area.select();
  document.execCommand('copy');
  area.remove();
  onCopied();
}

function showResults() {
  hide('card'); hide('progress-bar-wrap'); hide('phase-transition');
  show('results');

  const summaryRows = getSummaryRows();
  const finalRows = getFinalResultRows();
  const errorCount = finalRows.length;
  const totalWords = study.words.length;
  const accuracy = totalWords > 0 ? Math.round((totalWords - errorCount) / totalWords * 100) : 100;
  document.getElementById('results-stats').textContent =
    `Pendientes tras el repaso: ${errorCount} de ${totalWords} · Dominio: ${accuracy}%`;

  // ── Repeat-errors button: only show if there are errors ──────────────────────
  document.getElementById('btn-repeat-errors').style.display = errorCount > 0 ? 'block' : 'none';

  // ── Mistakes table ───────────────────────────────────────────────────────────
  const list = document.getElementById('mistakes-list');
  const hasCol = dataMode === '3';
  let html = `<table class="results-table"><thead><tr>
    <th>Dato A</th><th>Dato B</th>${hasCol ? '<th>Dato C</th>' : ''}<th>Estado final</th><th>Detalle</th>
  </tr></thead><tbody>`;
  summaryRows.forEach(row => {
    html += `<tr>
      <td class="td-a">${escapeHtml(row.a)}</td>
      <td>${escapeHtml(row.b)}</td>
      ${hasCol ? `<td class="td-c">${escapeHtml(row.c || '—')}</td>` : ''}
      <td><span class="status-tag status-${row.status.key}">${row.status.label}</span></td>
      <td class="summary-detail">${row.status.detail}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  list.innerHTML = html;
}

// ─── REPEAT FUNCTIONS ─────────────────────────────────────────────────────────

function repeatErrors() {
  const errorWords = getFinalResultRows();
  if (errorWords.length === 0) return;
  study.words = shuffle(prepareWords(errorWords));
  study.groups = [];
  for (let i = 0; i < study.words.length; i += config.groupSize) {
    study.groups.push(study.words.slice(i, i + config.groupSize));
  }
  session = createSession();
  hide('results'); show('progress-bar-wrap'); show('card');
  loadSubPhase();
}

function repeatLastGroup() {
  const group = study.groups[session.lastGroupIndex] || study.groups[study.groups.length - 1];
  // Keep the same group-sized distractor pool as the original repeat behavior.
  study.words = prepareWords(group.map(({ a, b, c }) => ({ a, b, c })));
  study.groups = [study.words];
  session = createSession();
  hide('results'); show('progress-bar-wrap'); show('card');
  loadSubPhase();
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────

function show(id) { const el = document.getElementById(id); if (el) el.style.display = 'block'; }
function hide(id) { const el = document.getElementById(id); if (el) el.style.display = 'none'; }
